# /etc/nginx/sites-available/http-boot - nginx HTTP server for HTTP Boot payload delivery.
# Written by homelab deploy; do not edit manually.

server {
    listen {{ MGMT_IP }}:80 default_server;
    listen 127.0.0.1:80;
    listen 0.0.0.0:80;

    root /srv/httpboot;
    autoindex off;

    # Serve iPXE menu and payload files
    location / {
        try_files $uri =404;
    }

    # Health check endpoint for pve-http-boot-autoupdate smoke test
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/http-boot-access.log;
    error_log  /var/log/nginx/http-boot-error.log;
}
