groups:
  - name: smart-disks
    interval: 1m
    rules:
      # Mirrors TrueNAS's smart.py: overall SMART self-assessment failed.
      - alert: SmartStatusFailed
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} disk {{ $labels.device }} failed SMART overall-health check"
          description: "smartctl reports SMART overall-health self-assessment as FAILED for {{ $labels.device }} on {{ $labels.host }}. The drive itself considers failure imminent. Check `smartctl -a /dev/{{ $labels.device }}` on {{ $labels.host }}."

      # smartctl_exporter doesn't expose each drive's own reported critical
      # temperature threshold (unlike TrueNAS, which alerts against that
      # drive-specific value), so these are fixed thresholds. Spinning rust runs
      # meaningfully cooler than flash under normal load in this fleet, so the
      # two classes need different bounds.
      #
      # The split is on smartctl_device_rotation_rate, NOT on the device name.
      # The name-based form this replaces (device!~"nvme.*" >= 58) assumed the
      # kernel name tells you the media type, and it does not: cinci's sda is a
      # Samsung 970 EVO Plus in a USB enclosure, so it enumerates as sd* and was
      # handed the 58C HDD bound. It peaked at 65-67C during the 00:00 snapshot
      # and 00:30 PBS backup window on 08-01, 08-09 and 09-01 -- entirely normal
      # for that drive (rated 0-70C, throttles ~80C) and reported as a hardware
      # problem every time. Any future SATA/USB-attached SSD would have hit the
      # same trap.
      #
      # smartctl_exporter only emits rotation_rate for drives that actually
      # report one, so its presence is the media type: series exists -> HDD,
      # absent -> SSD/NVMe. `unless on(host,device)` is what expresses "absent"
      # here; a plain negative matcher cannot, because the label is missing
      # rather than empty. Verified live 2026-09-01: 10 rotational series across
      # ace/clovis/cottonwood, 13 non-rotational including both cinci sd* SSDs.
      - alert: SmartDeviceTemperatureHigh
        expr: |
          (smartctl_device_temperature{temperature_type="current"} >= 58
            and on(host, device) smartctl_device_rotation_rate)
          or
          (smartctl_device_temperature{temperature_type="current"} >= 75
            unless on(host, device) smartctl_device_rotation_rate)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} disk {{ $labels.device }} is {{ $value }}C"
          description: "{{ $labels.device }} on {{ $labels.host }} has been hot for 10+ minutes. Check airflow/cooling and `smartctl -a /dev/{{ $labels.device }}`."

      # Mirrors TrueNAS's "Uncorrected Errors Detected": the standard set of
      # ATA pre-fail attributes whose raw value should normally stay at 0.
      # Unlike ZfsPoolDeviceErrors (vmalert-rules/configs/zfs-pools.yml), this
      # is drive-reported SMART data rather than ZFS's own read/write/cksum
      # counters, so it can catch (or corroborate) problems independently of
      # what ZFS itself has noticed -- and vice versa: the disk that failed on
      # ace/vault-hdd on 2026-08-10 stopped responding to smartctl entirely
      # once it dropped offline, so SMART alone would have caught nothing for
      # that specific failure.
      - alert: SmartAttributeUncorrectable
        expr: smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} disk {{ $labels.device }} has {{ $labels.attribute_name }} = {{ $value }}"
          description: "SMART attribute {{ $labels.attribute_name }} (id {{ $labels.attribute_id }}) is {{ $value }} (raw) on {{ $labels.device }}/{{ $labels.host }}. This should normally be 0; a nonzero value means the drive has already remapped or failed to read/verify sectors. Check `smartctl -a /dev/{{ $labels.device }}` on {{ $labels.host }}."

      # Companion to SmartAttributeUncorrectable above, covering the signal that
      # rule structurally cannot carry: rate of change.
      #
      # `raw > 0` latches. The moment a drive remaps a single sector it fires
      # and then fires forever, because the raw counter never goes back down.
      # Once that has happened the series is pinned in the firing state and
      # stops distinguishing "this drive remapped one sector two years ago and
      # has been stable since" from "this drive is shedding sectors right now"
      # -- and the realistic response to a permanently-firing warning is a
      # silence, which makes the drive silent for the second case too.
      #
      # Growth is the actual pre-failure indicator: a stable nonzero count is
      # common and usually benign, an increasing one is not. Verified against
      # live data 2026-09-16: no disk in the fleet currently has a nonzero
      # value for any of these four attributes, so this rule is preventive --
      # it is in place before the first reallocation rather than in response to
      # one, and neither rule is firing today.
      #
      # Critical rather than warning, unlike the static rule: the static one is
      # expected to be firing (or silenced) on any drive this can match, so
      # matching its severity would file the active-degradation case into the
      # same bucket as the latched one and defeat the point.
      #
      # delta() over 7d is negative when a drive is replaced and the counter
      # resets to 0, so a swap cannot fire this. It does mean the alert stays
      # up for 7 days after the last increment; that is intended -- the window
      # is the claim ("degraded during the last week"), not a debounce.
      - alert: SmartAttributeGrowing
        expr: delta(smartctl_device_attribute{attribute_value_type="raw", attribute_name=~"Reallocated_Sector_Ct|Current_Pending_Sector|Offline_Uncorrectable|Reported_Uncorrect"}[7d]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} disk {{ $labels.device }} gained {{ $value }} {{ $labels.attribute_name }} in 7 days"
          description: "SMART attribute {{ $labels.attribute_name }} on {{ $labels.device }}/{{ $labels.host }} has increased by {{ $value }} in the last 7 days. A drive actively remapping or failing to read sectors now is a stronger failure signal than a stable nonzero count. Check `smartctl -a /dev/{{ $labels.device }}` on {{ $labels.host }}, confirm the pool has redundancy, and plan a replacement."

      - alert: SmartMetricsMissing
        expr: absent_over_time(smartctl_device_smart_status{host=~"ace|bray|clovis|osiris"}[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SMART metrics missing"
          description: "smartctl_device_smart_status has produced no samples for any ace/bray/clovis/osiris disk in 15 minutes; smartctl_exporter may be down."
