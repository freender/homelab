groups:
  - name: systemd-failed
    interval: 1m
    rules:
      # Repo-deployed units, split out from SystemdUnitFailed below only to
      # carry module-specific remediation; the check itself is identical.
      - alert: HomelabUnitFailed
        expr: node_systemd_unit_state{name=~"homelab-.*",state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.host }}"
          description: "The repo-deployed unit {{ $labels.name }} is in the failed state on {{ $labels.host }}. Check `systemctl status {{ $labels.name }}` and `journalctl -u {{ $labels.name }}`. A redeploy of the owning module clears transient failures for units wired to homelab_recover_failed_units."

      # Failed-unit coverage from node_exporter's native systemd collector, by
      # name, for every non-homelab unit (homelab-* is covered above with
      # module-specific recovery guidance). Fires once per failed unit instead
      # of a bare count, so the alert itself names the unit -- no separate
      # `systemctl --failed` lookup needed.
      #
      # No host filter, deliberately. The series only exists for hosts vmagent
      # already scrapes, so scrape.yml is the gate; a host list here is a
      # hand-maintained second copy of it that can only drift out of sync.
      # It did: helm/neo/tower were omitted and their permanently-failed
      # openipmi.service went unnoticed for exactly that reason. An absent or
      # intermittent host (ghost) produces no series and so stays quiet --
      # missing metrics are the absence rules' job, below.
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{name!~"homelab-.*",state="failed"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.host }}"
          description: "The unit {{ $labels.name }} is in the failed state on {{ $labels.host }}. Check `systemctl status {{ $labels.name }}` and `journalctl -u {{ $labels.name }}` on {{ $labels.host }}."

      # Detect an exporter that remains reachable while its systemd collector
      # is failing, which would otherwise make failed-unit alerting blind.
      # Unfiltered for the same reason as SystemdUnitFailed above.
      - alert: SystemdCollectorFailing
        expr: node_scrape_collector_success{collector="systemd"} == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} node_exporter systemd collector is failing"
          description: "node_scrape_collector_success{collector=\"systemd\"} is 0 on {{ $labels.host }}, so failed-unit alerting is blind there. Check node_exporter health and collector configuration."

      # The only rules that legitimately enumerate hosts: absence cannot be
      # detected without naming what should be present. One absent_over_time()
      # per exact host, because a regex matcher only detects full-vector
      # absence, so the previous single-selector form stayed silent unless
      # every listed host went dark at once. ghost is deliberately absent from
      # this list — it is a roaming laptop, so missing metrics there mean
      # "away", not "monitoring broken". Offsite hosts keep their own longer
      # window below.
      - alert: SystemdUnitMetricsMissing
        expr: |
          absent_over_time(node_systemd_units{host="ace",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="bray",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="clovis",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="osiris",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="helm",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="neo",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="tower",state="failed"}[15m])
          or absent_over_time(node_systemd_units{host="riven",state="failed"}[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "systemd failed-unit metrics missing on {{ $labels.host }}"
          description: "node_systemd_units has produced no samples for {{ $labels.host }} in 15 minutes, so failed-unit alerting is blind there. node_exporter may be down or its systemd collector disabled. Check `systemctl status prometheus-node-exporter` on {{ $labels.host }}."

      - alert: SystemdUnitMetricsMissingOffsite
        expr: absent_over_time(node_systemd_units{host=~"cinci|cottonwood",state="failed"}[1h])
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Offsite systemd failed-unit metrics missing"
          description: "node_systemd_units has produced no samples for cinci/cottonwood in 1 hour; the longer window tolerates offsite link flaps. The node_exporter systemd collector may be unavailable, or the host may be unreachable."
