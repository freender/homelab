groups:
  - name: apt-updates
    interval: 1m
    rules:
      # Both rules read apt_upgrades_pending, which every host already publishes
      # into apt.prom via apt_info.py from the distro package
      # prometheus-node-exporter-collectors. Nothing in this repo collects it --
      # it was simply never alerted on, which is how four hypervisors reached 20
      # pending security updates unnoticed.

      # Safety net for apt-upgrade, not a patching reminder. Every apt-capable
      # host in the fleet now runs that module's daily dist-upgrade, so this
      # expression should be empty almost all the time; a host that stays
      # non-zero for a week means the automation stopped working (timer masked,
      # a held package, no disk space, a repo that fails without apt-get
      # exiting non-zero).
      #
      # This used to be the safety net for apt-security-updates, which covered
      # only the PVE nodes and only the Debian-Security origin. That module is
      # archived; the sentence about "hosts covered by apt-upgrade clear it
      # daily so they can never reach 7d" is now true of every host, which is
      # what makes the rule self-selecting rather than carrying a host list
      # that drifts out of step with hosts.conf.
      #
      # 7d survives a vmalert restart: vmalert runs with -remoteWrite.url and
      # -remoteRead.url, so pending-alert start times persist to
      # VictoriaMetrics as ALERTS_FOR_STATE and are restored on startup.
      # Confirmed live on helm, 2026-08-17.
      #
      # New CVEs landing do not reset the timer. `for:` only restarts when the
      # expression stops returning a series for that label set -- i.e. when the
      # count actually reaches 0 and the host is fully patched. A count moving
      # 20 -> 21 changes the value, not the label set.
      - alert: SecurityUpdatesPending
        expr: sum by (host) (apt_upgrades_pending{origin=~".*[Ss]ecurity.*"}) > 0
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has had security updates pending for a week"
          description: "{{ $labels.host }} has carried at least one unapplied security update continuously for 7 days ({{ $value }} pending now). Every apt-capable host runs apt-upgrade's daily dist-upgrade, so this means that automation has stopped achieving anything: check `systemctl status homelab-apt-dist-upgrade.timer` and `journalctl -u homelab-apt-dist-upgrade` on {{ $labels.host }}, and look for held packages with `apt-mark showhold`."

      # This rule inverted when the PVE nodes moved from apt-security-updates to
      # apt-upgrade. It used to be a reminder for a condition that was true
      # nearly all the time by design -- Proxmox packages were left standing
      # between manual monthly windows. Now apt-upgrade dist-upgrades all four
      # nodes daily at 05:00-05:15, so this expression should be empty almost
      # always, and a host that stays non-zero means the automation stopped.
      # Same shape and same job as SecurityUpdatesPending above.
      #
      # 3d, not the old 1h: at 1h this would fire every single morning in the
      # window between the repo publishing a package and that node's 05:0x run
      # picking it up. 3d clears any normal daily run, a missed run, and a
      # weekend, so firing means several consecutive runs achieved nothing --
      # held package, dpkg lock, repo failure that apt-get did not exit non-zero
      # on. The unit *failing* is caught far sooner and by a different rule:
      # homelab-apt-dist-upgrade.service is matched by SystemdUnitFailed's
      # homelab-.* expression, which pages in minutes. This is the backstop for
      # the case where the unit succeeds and still upgrades nothing.
      #
      # The alertname is now slightly stale -- it reads as "updates exist" when
      # it means "updates are not being applied" -- but it is deliberately not
      # renamed here: monitoring-config's Alertmanager route matches on
      # alertname="ProxmoxUpdatesAvailable", and a rename landing in only one of
      # the two files drops it onto the default 4h-repeat route. Rename both or
      # neither.
      #
      # Kept on the Saturday digest route (group_by [alertname],
      # active_time_intervals) so all four nodes still collapse into one weekly
      # message. Weekly is fast enough for a backstop whose fast path is
      # SystemdUnitFailed.
      - alert: ProxmoxUpdatesAvailable
        expr: sum by (host) (apt_upgrades_pending{origin=~"Proxmox.*"}) > 0
        for: 3d
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }}: {{ $value }} Proxmox updates unapplied for 3 days"
          description: "{{ $labels.host }} has carried {{ $value }} pending packages from the Proxmox repository for 3 days, but apt-upgrade dist-upgrades this node daily at 05:00-05:15 -- so the automation has stopped achieving anything. Check `systemctl status homelab-apt-dist-upgrade.timer` and `journalctl -u homelab-apt-dist-upgrade` on {{ $labels.host }}, and look for held packages with `apt-mark showhold`."
