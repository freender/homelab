groups:
  - name: important-containers
    interval: 30s
    rules:
      - alert: ImportantContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="radarr"}[5m])
        labels: {severity: warning, category: docker, site: home, host: tower, name: radarr}
        annotations: {summary: "tower / radarr is missing", description: "Important app container has not been seen by cAdvisor for 5 minutes."}
