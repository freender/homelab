groups:
  - name: temperatures
    interval: 1m
    rules:
      # Disk temperatures (HDD/SSD/NVMe) are NOT here -- they live in
      # smart-disks.yml next to the other smartctl_exporter rules, because they
      # come from the same exporter and share its failure modes.
      #
      # This file covers the two components that had no temperature alerting at
      # all: the SAS HBA (added 2026-08-13, see metrics-exporters/README.md --
      # the card had no temperature *metric* before that, let alone an alert)
      # and the CPU package/cores, whose hwmon data has always been collected
      # but never alerted on.

      # SAS2308's maximum ASIC junction temperature is 115C. This is a die
      # temperature, not a heatsink reading, so it is normal for it to look
      # alarming next to a CPU package figure -- but the ceiling is what it is.
      #
      # Measured on the day the exporter was added, at idle: ace 96C, clovis
      # 116C. clovis is therefore over the limit and fires the critical rule
      # immediately. That is a true positive, confirmed twice by hand the same
      # day: its heatsink is too hot to touch, and opening the case dropped the
      # reading 116C -> 98C within minutes while ace, untouched, stayed at 95C.
      # The sensor tracks airflow in real time; it is not a fixed offset.
      #
      # clovis is the hotter one despite having a slot fan and an idle
      # (vfio-bound) GPU, so this is not case airflow. Two reasons:
      #   - It drives 6 SAS links to ace's 2, and the card's own
      #     BoardPowerRequirement reflects it: 14W vs 10W into a heatsink of
      #     the same size.
      #   - The two cards are not the same hardware. ace's is a genuine LSI
      #     (board_assembly H3-25412-00K, board_tracer SV52978426, SAS address
      #     in LSI's 500605b range); clovis's reports no board assembly, no
      #     serial, and SAS address 0x56c92bf0..., i.e. a clone or a
      #     cross-flashed OEM card with unprogrammed manufacturing NVDATA.
      # A hot heatsink means the die-to-heatsink path is fine and the fins
      # simply cannot shed 14W without air moving over them specifically.
      #
      # 100C leaves ~15C of warning runway below the ceiling; 110C means only
      # 5C is left and the card should not be left running as-is.
      - alert: HbaTemperatureHigh
        expr: homelab_hba_temperature_celsius{sensor="ioc"} >= 100 and homelab_hba_temperature_celsius{sensor="ioc"} < 110
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} HBA {{ $labels.board }} is {{ $value }}C"
          description: "The {{ $labels.board }} ({{ $labels.chip }}) at {{ $labels.pci }} on {{ $labels.host }} has been at or above 100C for 15+ minutes, against a 115C maximum for the ASIC. These cards are passively cooled and depend entirely on case airflow. Add directed airflow (a 40mm fan on the heatsink is the standard fix) or re-pad the heatsink."

      - alert: HbaTemperatureCritical
        expr: homelab_hba_temperature_celsius{sensor="ioc"} >= 110
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} HBA {{ $labels.board }} is {{ $value }}C"
          description: "The {{ $labels.board }} ({{ $labels.chip }}) at {{ $labels.pci }} on {{ $labels.host }} is within 5C of, or above, the 115C maximum ASIC temperature. Every disk behind this controller depends on it. Check for dropped links with `cat /sys/class/sas_phy/phy-*/invalid_dword_count` and for controller resets with `journalctl -k | grep mpt`, and fix the airflow."

      # A card whose firmware reports no sensor, or that stops answering the
      # config-page read, keeps its series but flips this flag -- so the failure
      # is visible instead of being an absent series that no threshold can match.
      - alert: HbaTemperatureReadFailed
        expr: homelab_hba_temperature_read_success == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} cannot read HBA {{ $labels.board }} temperature"
          description: "hba-textfile-exporter reached the {{ $labels.board }} at {{ $labels.pci }} on {{ $labels.host }} but could not read a temperature from MPI2 IO Unit Page 7. Run /usr/local/bin/hba-textfile-exporter on {{ $labels.host }} for the firmware error."

      # The textfile collector keeps serving whatever is in its directory, so a
      # dead exporter does not produce an absent series -- it produces a frozen
      # temperature, which is worse: the HBA could be cooking while the graph
      # sits flat at its last good value. The timer runs every minute, so
      # 15 minutes without a rewrite means it is broken.
      - alert: HbaTemperatureStale
        expr: time() - node_textfile_mtime_seconds{file=~".*/hba\\.prom"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} HBA temperature metrics are stale"
          description: "hba.prom on {{ $labels.host }} has not been rewritten in over 15 minutes, so homelab_hba_temperature_celsius is frozen at its last value and any threshold on it is meaningless. Check `systemctl status hba-textfile-exporter.timer` on {{ $labels.host }}."

      # CPU temperature is judged against each CPU's own reported critical
      # point (node_hwmon_temp_crit_celsius: 100C on ace/bray/clovis/cottonwood,
      # 105C on cinci/osiris) rather than one fixed number, so the thresholds
      # stay correct when a host is rebuilt on different silicon.
      #
      # Aggregated to one series per host with max()/min(): a hot CPU otherwise
      # fires one alert per core, which on bray would be 13 notifications for a
      # single event. min() on the critical point is the conservative choice if
      # cores ever disagree.
      #
      # 7d peaks when this was written: cinci 97C (crit 105), cottonwood 96C
      # (crit 100), bray 88C (crit 100), the rest below 75C. So cinci and
      # cottonwood are the two that will exercise this first.
      #
      # LXC guests are absent by design -- their hwmon collector is negated
      # (see metrics-exporters/README.md), because /sys/class/hwmon inside a
      # guest is the PVE host's sensors, not its own.
      - alert: CpuTemperatureHigh
        expr: |
          max by (host) (node_hwmon_temp_celsius{chip=~".*coretemp.*"})
            >= (min by (host) (node_hwmon_temp_crit_celsius{chip=~".*coretemp.*"}) - 15)
          and
          max by (host) (node_hwmon_temp_celsius{chip=~".*coretemp.*"})
            < (min by (host) (node_hwmon_temp_crit_celsius{chip=~".*coretemp.*"}) - 5)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU is {{ $value }}C"
          description: "The hottest core on {{ $labels.host }} has been within 15C of the CPU's own critical temperature for 15+ minutes. Check cooling and what is loading the host; sustained operation this close to Tj max shortens the part's life even though it has not started throttling yet."

      - alert: CpuTemperatureCritical
        expr: |
          max by (host) (node_hwmon_temp_celsius{chip=~".*coretemp.*"})
            >= (min by (host) (node_hwmon_temp_crit_celsius{chip=~".*coretemp.*"}) - 5)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} CPU is {{ $value }}C"
          description: "{{ $labels.host }} is within 5C of its CPU critical temperature and is at or near thermal throttling. Check fans, heatsink seating and dust, and whatever is loading the host right now."

      # 10G NIC die temperature. Today this matches ace and clovis only: both run
      # an Intel 82599ES (X520) SFP+ card whose ixgbe driver registers an on-die
      # sensor. The metric has always been collected by node_exporter's hwmon
      # collector but was never alerted on.
      #
      # bray is absent, and cannot be added. Its 10G card is an X710, and
      # mainline i40e registers no hwmon device at all (verified on 7.0.14-8-pve:
      # no NIC entry in /sys/class/hwmon, no hwmon symbols in i40e.ko), so there
      # is no series to alert on. The die does have a thermal sensor, but it is
      # only reachable through unsupported firmware Admin Queue / debugfs pokes.
      # There is no transceiver fallback either: every SFP+ cage in the homelab
      # holds a passive DAC (SFP-H10GB-CU1M / CAB-10GSFP-P1M), which carries no
      # DDM diagnostics page, so `ethtool -m` reports no temperature anywhere.
      #
      # The chip_name match is therefore a driver allowlist, not just "ixgbe":
      # ice (E810) gained hwmon support in 6.9 and would be picked up
      # automatically, so replacing bray's X710 with an E810 starts alerting
      # without a rule change instead of silently staying unmonitored. i40e is
      # listed for the same reason -- if it ever grows hwmon support upstream.
      # A driver that registers no hwmon device simply contributes no series.
      #
      # One sensor per card, not per port -- the 82599ES is a single die driving
      # both SFP+ ports, so this one reading covers the whole adapter.
      #
      # The threshold numbers are fixed rather than derived from the card's own
      # sysfs values (as the CPU rules do), because ixgbe's hwmon labels are
      # inverted relative to coretemp: temp1_crit (95C) is the *caution*
      # threshold and temp1_max (105C) is the max operating threshold. Reusing
      # the `crit - N` pattern here would read as correct and mean the wrong
      # thing. 85C leaves 10C of runway below caution; 95C is caution itself.
      # Both numbers stay conservative for the other allowlisted drivers too --
      # E810's maximum is higher still, so this errs early rather than late.
      #
      # 7d range when this was written: ace 35-48C, clovis 35-37C. Neither is
      # close, so this is early warning for a dead case fan or a blocked slot,
      # not a live problem. ace runs ~10C hotter than clovis because its card
      # sits in a slot with no directed airflow.
      #
      # Joined through node_hwmon_chip_names on chip_name rather than matching
      # the chip label directly: the chip label embeds the full PCI path
      # (0000:00:01_0_0000:01:00_1), so a card moved to another slot would
      # silently stop matching a hardcoded regex.
      - alert: NicTemperatureHigh
        expr: |
          (node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name)
            node_hwmon_chip_names{chip_name=~"ixgbe|i40e|ice"}) >= 85
          and
          (node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name)
            node_hwmon_chip_names{chip_name=~"ixgbe|i40e|ice"}) < 95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} 10G NIC is {{ $value }}C"
          description: "The 10G NIC ({{ $labels.chip_name }}, {{ $labels.chip }}) on {{ $labels.host }} has been at or above 85C for 15+ minutes, against a 95C caution threshold and a 105C maximum operating temperature. These cards are passively cooled and depend on case airflow. Check for a stopped case or slot fan and for anything blocking the card's heatsink."

      - alert: NicTemperatureCritical
        expr: |
          (node_hwmon_temp_celsius * on (instance, chip) group_left (chip_name)
            node_hwmon_chip_names{chip_name=~"ixgbe|i40e|ice"}) >= 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} 10G NIC is {{ $value }}C"
          description: "The 10G NIC ({{ $labels.chip_name }}, {{ $labels.chip }}) on {{ $labels.host }} is at or above its 95C caution threshold, with only 10C left to the 105C maximum. Storage and replication traffic on VLAN 60 rides this card. Check `journalctl -k | grep {{ $labels.chip_name }}` for resets and fix the airflow before it starts dropping links."
