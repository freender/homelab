      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="helm", name="cadvisor-helm"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: helm, name: cadvisor-helm}
