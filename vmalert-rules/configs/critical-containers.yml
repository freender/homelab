        annotations: {summary: "tower / seerr is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="socket-proxy-tower"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: tower, name: socket-proxy-tower}
        annotations: {summary: "tower / socket-proxy-tower is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="cadvisor-tower"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: tower, name: cadvisor-tower}
