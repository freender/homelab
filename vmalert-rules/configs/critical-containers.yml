groups:
  - name: critical-containers
    interval: 30s
    rules:
      # Every rule in this group is gated on the host having been continuously
      # scrapeable for 10 minutes, for the same reason DockerMetricsTargetDown
      # (docker.yml) and NicMissing (nic-link.yml) are: a host that is down
      # produces no container_last_seen samples either, so ungated
      # absent_over_time() cannot tell "this container is gone" from "this host
      # is gone".
      #
      # These rules have no `for:` and a 30s interval, so they notify at ~5m --
      # before NodeDown reaches its 10m threshold -- and an Alertmanager
      # inhibit_rule cannot retract a message it has already sent. Ungated, a
      # single tower outage emitted one critical per container, and because
      # group_by includes `name` each one is its own Telegram message (~10 for
      # tower alone) describing a container failure that never happened.
      #
      # The gate delays a genuine post-boot container failure to ~10m after the
      # host returns. That is the trade-off nic-link.yml documents: the host
      # must be up 10m, by which point a container that never started has
      # already accumulated its full 5m of absence, so the alert still lands.
      #
      # Offsite (cinci/cottonwood) gains the most: NodeDownOffsite does not
      # inhibit until 1h, so every WireGuard flap longer than 5m previously
      # paged once per offsite container.
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="traefik-tower"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: tower, name: traefik-tower}
        annotations: {summary: "tower / traefik-tower is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="crowdsec-tower"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: tower, name: crowdsec-tower}
        annotations: {summary: "tower / crowdsec-tower is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="plex"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: tower, name: plex}
        annotations: {summary: "tower / plex is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="seerr"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
