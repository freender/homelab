groups:
  - name: critical-containers
    interval: 30s
    rules:
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="traefik-tower"}[5m])
        labels: {severity: critical, category: docker, site: home, host: tower, name: traefik-tower}
        annotations: {summary: "tower / traefik-tower is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="crowdsec-tower"}[5m])
        labels: {severity: critical, category: docker, site: home, host: tower, name: crowdsec-tower}
        annotations: {summary: "tower / crowdsec-tower is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="plex"}[5m])
        labels: {severity: critical, category: docker, site: home, host: tower, name: plex}
        annotations: {summary: "tower / plex is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="seerr"}[5m])
        labels: {severity: critical, category: docker, site: home, host: tower, name: seerr}
        annotations: {summary: "tower / seerr is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="tower", name="socket-proxy-tower"}[5m])
