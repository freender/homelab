        expr: absent_over_time(container_last_seen{job="cadvisor", host="neo", name="cadvisor-neo"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
        labels: {severity: critical, category: docker, site: home, host: neo, name: cadvisor-neo}
        annotations: {summary: "neo / cadvisor-neo is missing", description: "Critical container has not been seen by cAdvisor for 5 minutes."}
      - alert: CriticalContainerMissing
        expr: absent_over_time(container_last_seen{job="cadvisor", host="neo", name="vmagent-neo"}[5m]) and on(host) (min_over_time(up{job="pve-node"}[10m]) == 1)
