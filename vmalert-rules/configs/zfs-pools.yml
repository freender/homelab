groups:
  - name: zfs-pools
    interval: 1m
    rules:
      - alert: ZfsPoolDegraded
        expr: homelab_zpool_healthy == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} is not ONLINE"
          description: "homelab_zpool_healthy is 0 for {{ $labels.host }}/{{ $labels.zpool }} (tier={{ $labels.tier }}, role={{ $labels.role }}). Check `zpool status -x {{ $labels.zpool }}` on {{ $labels.host }}."

      # Pool-level health does not see a failed disk inside a redundant vdev:
      # `zpool list` keeps reporting ONLINE while a raidz1 member is FAULTED and
      # the vdev has no redundancy left. ace/vault-hdd failed exactly this way on
      # 2026-08-09 and ZfsPoolDegraded never fired.
      - alert: ZfsPoolDeviceUnhealthy
        expr: homelab_zpool_devices_unhealthy > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} has {{ $value }} device(s) not ONLINE"
          description: "A leaf device in {{ $labels.host }}/{{ $labels.zpool }} (tier={{ $labels.tier }}, role={{ $labels.role }}) is not ONLINE. Redundancy is reduced or gone even if the pool still reports ONLINE. Run `zpool status -x` on {{ $labels.host }} and check homelab_zpool_device_state_info for the failing device."

      # Error counters climb before a device is dropped, so this is the early
      # warning that precedes ZfsPoolDeviceUnhealthy.
      - alert: ZfsPoolDeviceErrors
        expr: homelab_zpool_device_errors > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} device {{ $labels.device }} has {{ $labels.type }} errors"
          description: "{{ $value }} {{ $labels.type }} error(s) on {{ $labels.device }} in {{ $labels.host }}/{{ $labels.zpool }}. Checksum errors mean returned-but-wrong data; read/write errors mean the device is not answering. Check `zpool status -v` and SMART on {{ $labels.host }}."

      - alert: ZfsPoolMetricsMissing
        expr: absent_over_time(homelab_zpool_healthy{host=~"ace|bray|clovis|osiris"}[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool health metrics missing"
          description: "homelab_zpool_healthy has produced no samples for any ace/bray/clovis/osiris pool in 15 minutes; the zfs-pool-textfile-exporter timer may be stopped or node_exporter may be down."

      - alert: ZfsPoolMetricsMissingOffsite
        expr: absent_over_time(homelab_zpool_healthy{host=~"cinci|cottonwood"}[1h])
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Offsite ZFS pool health metrics missing"
          description: "homelab_zpool_healthy has produced no samples for any cinci/cottonwood pool in 1 hour; longer window than the on-prem rule to tolerate offsite link flaps. Could mean the exporter/link is down, or that host is genuinely unreachable."
