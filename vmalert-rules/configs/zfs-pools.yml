groups:
  - name: zfs-pools
    interval: 1m
    rules:
      # Pool-level health alone does not see a failed disk inside a redundant
      # vdev: `zpool list` can keep reporting ONLINE while a raidz1 member is
      # FAULTED and the vdev has no redundancy left. ace/vault-hdd failed
      # exactly this way on 2026-08-09 and a pool-health-only check never
      # fired. Rather than splitting pool-health and device-health into two
      # alerts that both fire for one failing disk (as TrueNAS's middleware
      # deliberately does not -- it folds both into a single VolumeStatusAlert
      # per pool, see truenas/middleware src/middlewared/middlewared/alert/
      # source/volume_status.py), this rule combines both signals: it fires if
      # the pool itself isn't ONLINE, or if any leaf device isn't ONLINE, or
      # both -- one alert either way.
      - alert: ZfsPoolUnhealthy
        expr: (1 - homelab_zpool_healthy) + homelab_zpool_devices_unhealthy > 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} is unhealthy"
          description: "{{ $labels.host }}/{{ $labels.zpool }} (tier={{ $labels.tier }}, role={{ $labels.role }}) is not fully healthy: pool-level state isn't ONLINE and/or one or more leaf devices aren't ONLINE. Redundancy may be reduced or gone even if `zpool list` still shows ONLINE. Run `zpool status -x` on {{ $labels.host }} and check homelab_zpool_device_state_info for the failing device(s)."

      # No error-counter early-warning alert here on purpose, matching
      # TrueNAS's own model (truenas/middleware src/middlewared/middlewared/
      # alert/source/volume_status.py): it alerts purely on pool/device health
      # state, never on raw read/write/cksum counters. We tried that as
      # ZfsPoolDeviceErrors and dropped it 2026-08-11 -- it fired once per
      # device per error type (read+write+cksum), so a single failing disk
      # paged 2-3 extra warnings on top of the one ZfsPoolUnhealthy critical
      # that already covers the "pool ONLINE, device FAULTED/OFFLINE" case via
      # homelab_zpool_devices_unhealthy above. homelab_zpool_device_errors
      # still ships to VictoriaMetrics for Grafana/manual triage, it just
      # doesn't page on its own.

      # Mirrors TrueNAS's "Pool space usage is above N%" alert
      # (zpool_capacity.py), which checks 85/90/95%. We only use two severity
      # tiers (warning/critical) since that's the only scheme the rest of this
      # repo's alerting uses.
      - alert: ZfsPoolSpaceHigh
        expr: homelab_zpool_used_percent >= 90 and homelab_zpool_used_percent < 95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} is {{ $value }}% full"
          description: "{{ $labels.host }}/{{ $labels.zpool }} (tier={{ $labels.tier }}, role={{ $labels.role }}) is at {{ $value }}% capacity. ZFS performance degrades and free-space fragmentation gets worse as pools fill; plan to expand or clean up."

      - alert: ZfsPoolSpaceCritical
        expr: homelab_zpool_used_percent >= 95
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} is {{ $value }}% full"
          description: "{{ $labels.host }}/{{ $labels.zpool }} (tier={{ $labels.tier }}, role={{ $labels.role }}) is at {{ $value }}% capacity. ZFS pools become unstable and writes can fail as they approach 100%; free space or expand now."

      # Forecast counterpart to the two threshold rules above. ZfsPoolSpaceHigh
      # fires at 90%, which on a pool this size is not much notice: freeing
      # space on a media pool means deciding what to delete, and expanding one
      # means buying disks and scheduling downtime. Neither fits in the time
      # between 90% and 95%.
      #
      # Projects used_percent forward 14 days from a 7-day trend and fires if
      # it reaches the 95% critical line. The horizon is longer than the
      # filesystem rule's 7 days in node-resources.yml precisely because the
      # remedy is slower to arrange.
      #
      # Guards, for the same no-double-reporting reason as NodeFilesystemFillingUp:
      #   < 90 -- above this ZfsPoolSpaceHigh already owns the pool.
      #   >= 70 -- below this the projection is not worth acting on, and small
      #     nearly-empty pools (ace/rpool at 1%, bray/rpool at 4%) produce
      #     wild extrapolations from ordinary noise.
      - alert: ZfsPoolFillingUp
        expr: |
          predict_linear(homelab_zpool_used_percent[7d], 14 * 24 * 3600) >= 95
          and
          homelab_zpool_used_percent >= 70 < 90
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} zpool {{ $labels.zpool }} is on track to reach 95% within 14 days"
          description: "{{ $labels.host }}/{{ $labels.zpool }} (tier={{ $labels.tier }}, role={{ $labels.role }}) is at {{ $value }}% and its 7-day trend crosses the 95% critical line inside 14 days. This is the early warning for ZfsPoolSpaceHigh -- start planning cleanup or expansion now rather than at 90%."

      - alert: ZfsPoolMetricsMissing
        expr: absent_over_time(homelab_zpool_healthy{host=~"ace|bray|clovis|osiris"}[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool health metrics missing"
          description: "homelab_zpool_healthy has produced no samples for any ace/bray/clovis/osiris pool in 15 minutes; the zfs-pool-textfile-exporter timer may be stopped or node_exporter may be down."

      - alert: ZfsPoolMetricsMissingOffsite
        expr: absent_over_time(homelab_zpool_healthy{host=~"cinci|cottonwood"}[1h])
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Offsite ZFS pool health metrics missing"
          description: "homelab_zpool_healthy has produced no samples for any cinci/cottonwood pool in 1 hour; longer window than the on-prem rule to tolerate offsite link flaps. Could mean the exporter/link is down, or that host is genuinely unreachable."

      # The two rules above only catch an *absent* series, which is not how this
      # exporter fails. node_exporter's textfile collector keeps serving
      # whatever is already in its directory, so a dead
      # zfs-pool-textfile-exporter leaves homelab_zpool_healthy present and
      # frozen at its last value -- a pool could go DEGRADED while
      # ZfsPoolUnhealthy sits at a stale 0 and never fires. Same reasoning as
      # HbaTemperatureStale in temperatures.yml, and the same threshold: the
      # timer runs every minute, so 15 minutes without a rewrite is broken.
      #
      # No separate offsite window here, unlike the missing-metrics pair above:
      # this reads the file's mtime from a successful scrape, so an offsite link
      # flap makes the series absent rather than stale and cannot fire it.
      - alert: ZfsPoolMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*/zfs-pools\\.prom"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} ZFS pool metrics are stale"
          description: "zfs-pools.prom on {{ $labels.host }} has not been rewritten in over 15 minutes, so every homelab_zpool_* series is frozen at its last value and ZfsPoolUnhealthy/ZfsPoolSpaceCritical cannot fire on anything that has changed since. Check `systemctl status zfs-pool-textfile-exporter.timer` on {{ $labels.host }}."

      # Syncoid push replication (zfs-automation replication_jobs) into a push
      # target: osiris -> ace/clovis, cottonwood -> clovis -> ace, the cluster
      # nodes -> cinci. Measured on the *target*, from the newest snapshot that
      # actually arrived, because the push's own unit lives on the source and
      # HomelabUnitFailed only sees a run that ran and failed. This also catches
      # a timer that stopped, a run hung waiting on the replication lock, a
      # source host that is offline, and a source whose snapshots stopped.
      #
      # A received snapshot keeps its source creation time, so the value is the
      # age of the data, not of the last transfer. Every job here is daily and
      # replicates the source's daily autosnap, so the healthy worst case is
      # 24h plus the snapshot-to-push gap (longest: cottonwood's 00:00 Eastern
      # snapshot relayed to ace at 04:30, ~28.5h). 36h therefore means one
      # whole day's copy did not land.
      #
      # 0 (dataset missing or never snapshotted) is reported as a series on
      # purpose and fires this too: a replica that never arrived or was
      # destroyed is the most stale copy there is. Expect it during a first
      # full send. No host-up gate: a down target makes the series absent, and
      # NodeDown inhibition covers the rest.
      - alert: ZfsReplicaStale
        expr: time() - homelab_zfs_replica_last_snapshot_timestamp_seconds > 36 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "ZFS replica {{ $labels.dataset }} on {{ $labels.host }} is stale"
          description: "The newest snapshot on {{ $labels.host }}:{{ $labels.dataset }} is {{ $value | humanizeDuration }} old (over 36h; a value near 56 years means the dataset is missing or has no snapshot). Its daily push has not landed. Find the job that writes it in hosts.conf zfs-automation.replication_jobs, then check `systemctl status homelab-zfs-replication-<job>.service` and its journal on the source host; a run stuck in `activating` is waiting on the replication lock or another syncoid."
