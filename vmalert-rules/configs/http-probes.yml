groups:
  - name: http-probes
    interval: 30s
    rules:
      # Checks whether the service answers, not whether its container exists.
      # CriticalContainerMissing only sees container presence, and on 2026-11-07
      # a broken Docker on tower kept a plex container visible to cAdvisor
      # (18:29-18:34) while Plex was down from 18:17 to 18:50.
      #
      # No host-up gate, unlike the container rules: an unreachable Plex is
      # exactly what the Plex channel wants to hear about, whatever the cause.
      # `for: 5m` keeps routine HA migrations and restarts out of that external
      # channel: over 30 days, tower's routine Plex gaps were 0.8-4 minutes.
      # A tower outage past 10m is still inhibited by NodeDown (equal: host).
      - alert: ServiceUnreachable
        expr: probe_success{job="blackbox-http", name="plex"} == 0
        for: 5m
        labels: {severity: critical, category: http, site: home, host: tower, name: plex}
        annotations:
          summary: "Plex is not responding"
          description: "{{ $labels.endpoint }} has failed its HTTP check for 5 minutes."

      # The probe itself going quiet (blackbox-exporter down, or vmagent unable
      # to reach it) leaves ServiceUnreachable blind, not firing. It must carry
      # no `name` label, so it routes to the private chat, not the Plex channel.
      # absent_over_time() copies equality matchers into its result, so
      # `name="plex"` would add that label. The regex matcher `name=~"plex"` is
      # not copied.
      - alert: HttpProbeMissing
        expr: absent_over_time(probe_success{job="blackbox-http", name=~"plex"}[10m])
        labels: {severity: warning, category: http, site: home, host: helm, probe: plex}
        annotations:
          summary: "Plex HTTP probe has no data"
          description: "No probe_success for plex from blackbox-exporter on helm for 10 minutes, so ServiceUnreachable cannot fire. Check the blackbox-exporter container and the blackbox-http scrape job."
