groups:
  - name: reboot
    interval: 1m
    rules:
      # apt-upgrade installs kernel updates on its daily timer but deliberately
      # never reboots. Until this rule existed its only signal was a print_warn
      # emitted during a deploy run, so a host could sit on a superseded kernel
      # for weeks with nothing reporting it.
      #
      # Bare metal only, by construction rather than by a host filter here: the
      # series comes from reboot-textfile-exporter, which metrics-exporters gates
      # on `baremetal`, so LXC guests never produce it. A guest runs the PVE
      # host's kernel and has none of its own to boot into.
      #
      # Note the deliberate use of homelab_reboot_required and NOT the
      # node_reboot_required that apt.prom already publishes on every host: that
      # one is the distro collector's os.path.isfile('/run/reboot-required'),
      # which on Debian/Proxmox has no hook creating the file and so reads 0
      # forever. Alerting on it would look correct and never fire.
      #
      # 1h, not the 24h this carried until the PVE nodes moved to apt-upgrade.
      # The `for:` is no longer what debounces this rule -- monitoring-config
      # routes RebootRequired to a Saturday 09:00-09:10 window with
      # continue: false, so it can only ever notify once a week no matter how
      # long the pending state has stood. All 24h bought after that was a race:
      # apt-upgrade runs the PVE nodes at 05:00-05:15 and the exporter refreshes
      # every 15m, so a Saturday-morning kernel crossed the threshold at ~05:30,
      # too late for a 24h `for:` to elapse before 09:00 -- and was then held
      # until the *following* Saturday. A ~1-in-7 chance of a week-late reboot
      # notice, on the one signal whose whole job is to be timely.
      #
      # 1h fires by ~06:30 worst case, 2.5h of margin before the window opens,
      # while still absorbing a host that reboots on its own mid-window. Do not
      # raise this without moving the apt-upgrade schedules earlier to match,
      # and do not drop the Saturday route without raising it back -- the two
      # are coupled, and at 1h with the default 4h-repeat route this becomes a
      # six-times-a-day page for a deliberately standing condition.
      #
      # Survives a vmalert restart either way: vmalert runs with -remoteWrite.url
      # and -remoteRead.url (docker-stacks/stacks/vmalert/helm.yml), so pending
      # start times persist as ALERTS_FOR_STATE and are restored on startup.
      - alert: RebootRequired
        expr: homelab_reboot_required == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} needs a reboot"
          description: "{{ $labels.host }} has a reboot pending: it is running an older kernel than the newest one installed, or a package update set the reboot-required flag. Check homelab_kernel_info{host=\"{{ $labels.host }}\"} for the running vs installed kernel release, then schedule a reboot. Nothing reboots these hosts automatically. On the PVE nodes use the three waves in pve-upgrade/README.md: osiris + ace, then clovis, then bray; wait for every node and HA migration to settle between waves."

      # Absence, per the pattern established by ZfsPoolMetricsMissing: one
      # absent_over_time() per exact host, because a regex matcher only detects
      # full-vector absence and so stays silent unless every listed host goes
      # dark at once. These are exactly the hosts whose metrics-exporters config
      # has no lxc_guest flag.
      #
      # This also covers the case where the exporter runs but cannot identify an
      # installed kernel package: it emits homelab_kernel_info with an empty
      # installed label and deliberately omits homelab_reboot_required rather
      # than reporting a possibly-wrong 0, which shows up here as absence.
      - alert: RebootMetricsMissing
        expr: |
          absent_over_time(homelab_reboot_required{host="ace"}[1h])
          or absent_over_time(homelab_reboot_required{host="bray"}[1h])
          or absent_over_time(homelab_reboot_required{host="clovis"}[1h])
          or absent_over_time(homelab_reboot_required{host="osiris"}[1h])
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pending-reboot metrics missing on {{ $labels.host }}"
          description: "homelab_reboot_required has produced no samples for {{ $labels.host }} in 1 hour, so pending-kernel alerting is blind there. The window is 1h because the exporter only refreshes every 15 minutes. Check `systemctl status reboot-textfile-exporter.timer` and `journalctl -u reboot-textfile-exporter` on {{ $labels.host }}."

      # The offsite half of the same coverage, split out only for its window:
      # 3h rather than the 1h above, to tolerate offsite link flaps, matching
      # ZfsPoolMetricsMissingOffsite in zfs-pools.yml. cinci and cottonwood are
      # the other two bare-metal hosts (systemd-detect-virt reports none on
      # both), so they own their kernels and belong in this rule.
      #
      # This matters more here than on-prem, not less. cinci and cottonwood are
      # the only two hosts in the fleet with apt-upgrade.auto_reboot true: they
      # hand the reboot to unattended-upgrades and take it themselves. That is
      # only safe while something can tell you it has stopped happening. If the
      # exporter dies, RebootRequired goes quiet for these two and a host that
      # has silently stopped rebooting itself looks identical to one that never
      # needed to.
      - alert: RebootMetricsMissingOffsite
        expr: |
          absent_over_time(homelab_reboot_required{host="cinci"}[3h])
          or absent_over_time(homelab_reboot_required{host="cottonwood"}[3h])
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Pending-reboot metrics missing on {{ $labels.host }}"
          description: "homelab_reboot_required has produced no samples for {{ $labels.host }} in 3 hours, so pending-kernel alerting is blind there. The window is longer than the on-prem rule's to tolerate offsite link flaps. This host reboots itself via unattended-upgrades, so a blind exporter also hides an auto-reboot that has stopped working. Check `systemctl status reboot-textfile-exporter.timer` and `journalctl -u reboot-textfile-exporter` on {{ $labels.host }}."
