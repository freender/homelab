groups:
  - name: solar
    interval: 1m
    rules:
      # solar (Bazzite VR VM) publishes these through node_exporter's textfile
      # collector: solar-metrics.timer runs vr-guest/files/libexec/solar-metrics
      # every 15 minutes, which runs solar-check and reads rpm-ostree and the
      # uupd journal. Nothing here is apt: Bazzite's uupd.timer stages a new image
      # daily by itself and never reboots, and solar is always on.

      # One series per solar-check id (karg:..., /etc/..., psvr2toolkit_dll,
      # compositor_cap_sys_nice, bluez_build_matches, ...). 30m absorbs a
      # vr-guest deploy or a SteamVR update mid-flight; anything that stays
      # failed past that needs a hand on solar. bluez_build_matches is the one
      # that fires after a Bazzite update: the patched bluetoothd was built for
      # the previous terra-bluez.
      - alert: SolarPatchCheckFailed
        expr: homelab_solar_check{host="solar"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "solar: solar-check {{ $labels.check }} failed"
          description: "The solar guest-side check `{{ $labels.check }}` has failed for 30 minutes. Run `/usr/local/libexec/solar-check` on solar for the reason. Common causes: a SteamVR update dropped cap_sys_nice, or a PS VR2 App update restored Sony's dll (both: `psvr2-steamvr quit` on solar, then `./deploy vr-guest solar` from the repo), or a Bazzite update shipped a new terra-bluez (`bluez_build_matches`: move the bluez-eagain inputs to it and deploy, per vr-guest/bluez-eagain/README.md, or roll back). /etc, home, script or bluetoothd-build drift (`bluez_build_inputs`, `bluez_dropin`): `./deploy vr-guest solar`."

      # The heads-up, not the nag: solar is a one-minute power-cycle, best taken
      # just before a VR session, so a staged image is worth knowing about the
      # day it lands rather than on the next Saturday. severity info routes it to
      # mwbot-quiet (silent Telegram, no resolved, one send per staged cycle).
      # The expr is the bare pending flag, not pending_info: uupd re-stages a
      # newer image every few days, and a version label would re-notify on each.
      # Version and package changes are read at render time instead.
      # No `for:`: rpm-ostree only reports a deployment once uupd has finished
      # staging it, and the flag holds through a re-stage until the next boot,
      # so there is no flap to debounce -- the 15m solar-metrics refresh is
      # already the only delay. SolarUpdatePending below stays as the 7-day
      # backstop.
      - alert: SolarUpdateStaged
        expr: homelab_ostree_update_pending{host="solar"} == 1
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "solar: Bazzite {{ with query \"homelab_ostree_pending_info{host='solar'}\" }}{{ . | first | label \"version\" }}{{ end }} staged — power-cycle before the next VR session"
          # The bluez line only renders when bluez actually changed;
          # SolarPatchCheckFailed covers anything the reboot breaks.
          description: "Updates: {{ range $i, $c := query \"homelab_ostree_pending_package_changed{host='solar'} == 1\" }}{{ if $i }}, {{ end }}{{ $c.Labels.package }}{{ else }}no kernel, NVIDIA or bluez change{{ end }}\nApply: ssh clovis qm shutdown 106 && ssh clovis qm start 106{{ with query \"homelab_ostree_pending_package_changed{host='solar',package='bluez'} == 1\" }}\n⚠️ bluez changed: move the bluez-eagain inputs to the new terra-bluez, then ./deploy vr-guest solar (vr-guest/bluez-eagain/README.md){{ end }}"

      # A staged (or finalized, not yet booted) Bazzite image only applies on a
      # full power-off/on of VM 106. uupd replaces the staged image daily without
      # changing this series' labels, so `for:` keeps counting from the first
      # staged image until solar actually boots into one. Routed to the Saturday
      # digest with RebootRequired.
      - alert: SolarUpdatePending
        expr: homelab_ostree_update_pending{host="solar"} == 1
        for: 7d
        labels:
          severity: warning
        annotations:
          summary: "solar: a Bazzite update has waited a week for a power-cycle"
          description: "solar has had a newer Bazzite deployment staged for 7 days (homelab_ostree_pending_info shows its version). If homelab_ostree_pending_package_changed{package=\"bluez\"} is 1, the bluez-eagain inputs need moving to the new terra-bluez (vr-guest/bluez-eagain/README.md). Apply with a full power-cycle when nobody is in the headset: `ssh clovis qm shutdown 106 && ssh clovis qm start 106`."

      # Updates are not landing at all: no pending image, and the booted one is
      # three weeks old. Bazzite stable publishes far more often than that, so
      # this means uupd's system module is skipping or failing quietly.
      - alert: SolarImageStale
        expr: |
          (time() - homelab_ostree_booted_timestamp_seconds{host="solar"}) > 21 * 86400
          and on(host) homelab_ostree_update_pending{host="solar"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "solar: booted Bazzite image is over 3 weeks old and nothing is staged"
          description: "solar's booted image was built more than 21 days ago and uupd has staged nothing newer. Check `journalctl -u uupd.service -b` and `rpm-ostree status` on solar, then `sudo uupd` by hand."

      # uupd.timer runs daily. A failed run that exhausts its restarts also
      # leaves uupd.service failed, which SystemdUnitFailed reports; this
      # catches the run that never happens or never completes.
      - alert: SolarUpdatesFailing
        expr: (time() - homelab_uupd_last_success_timestamp_seconds{host="solar"}) > 3 * 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "solar: no successful Bazzite update run in 3 days"
          description: "uupd has not logged 'Updates Completed Successfully' on solar for 3 days (0 means none in the 30-day journal window). Check `systemctl list-timers uupd.timer` and `journalctl -u uupd.service --since=-3d` on solar."

      # The check run itself, gated on the host being up so a powered-off solar
      # reports NodeDownSolar only. Covers solar-metrics not running, solar-check
      # or its check.json missing, and a run that produced no results.
      - alert: SolarMetricsMissing
        expr: |
          (
            absent_over_time(homelab_solar_check_run_success{host="solar"}[1h])
            or homelab_solar_check_run_success{host="solar"} == 0
            or time() - node_textfile_mtime_seconds{host="solar",file=~".*/solar\\.prom"} > 3600
          )
          and on(host) (min_over_time(up{job="pve-node", host="solar"}[30m]) == 1)
        for: 15m
        labels:
          severity: warning
          host: solar
        annotations:
          summary: "solar: patch and update metrics are missing or stale"
          description: "solar.prom has not been refreshed for an hour, or the last solar-check run reported nothing, so SolarPatchCheckFailed and the update rules are blind. Check `systemctl status solar-metrics.timer solar-metrics.service` and `journalctl -u solar-metrics.service` on solar, and run `/usr/local/libexec/solar-check` by hand; `./deploy vr-guest solar` reinstalls it."

      # The rules below read solar-gpu-metrics.service, which streams nvidia-smi
      # at 1 s into solar-gpu.prom (homelab-ops#410).
      #
      # nvidia_gpu_up 0 means nvidia-smi gave no sample for 5 s: the GPU fell
      # off the bus or the driver is gone. A stale file means the service itself
      # stopped publishing, and node_exporter would keep serving the last
      # nvidia_gpu_up 1, so it counts too. Gated on solar being up so a VM
      # reboot reports NodeDownSolar only.
      - alert: SolarGpuUnresponsive
        expr: |
          (
            nvidia_gpu_up{host="solar"} == 0
            or absent_over_time(nvidia_gpu_up{host="solar"}[10m])
            or time() - node_textfile_mtime_seconds{host="solar",file=~".*/solar-gpu\\.prom"} > 120
          )
          and on(host) (min_over_time(up{job="pve-node", host="solar"}[30m]) == 1)
        for: 5m
        labels:
          severity: warning
          host: solar
        annotations:
          summary: "solar: the RTX 3080 Ti is not answering nvidia-smi"
          description: "solar-gpu-metrics has had no nvidia-smi sample for 5 minutes, or has stopped writing solar-gpu.prom. Run `nvidia-smi` and `systemctl status solar-gpu-metrics` on solar, and look for NVRM/Xid lines in `journalctl -k -b`. A GPU that will not come back needs the VM power-cycled (ask first, someone may be in the headset); if it then fails to start, see Obsidian `PVE - NVIDIA GPU Stuck Reset`."

      # Thermal or hardware slowdown while SteamVR runs: dropped frames in the
      # headset. sw_power_cap is left out, it is the normal ceiling at full
      # load. avg over 5m tolerates a reason that flickers between samples;
      # with for: 5m it means throttled most of the last ~10 minutes.
      - alert: SolarGpuThrottling
        expr: |
          avg_over_time(nvidia_gpu_clock_event_reason{host="solar", reason=~"sw_thermal_slowdown|hw_thermal_slowdown|hw_slowdown|hw_power_brake_slowdown"}[5m]) > 0.5
          and on(host) homelab_solar_process_running{host="solar", process="vrserver"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "solar: GPU clocks held down by {{ $labels.reason }} during a VR session"
          description: "The 3080 Ti has reported `{{ $labels.reason }}` most of the last 10 minutes with SteamVR running. Thermal reasons: check `nvidia_gpu_temperature_celsius` and the fan on the VR - solar row, and clovis' case airflow. hw_slowdown or hw_power_brake_slowdown: the board asserted its slowdown line, usually a power transient or an external power brake (see the vr skill's clovis PSU notes)."

      # clovis' Z490 splits the CPU's 16 lanes x8/x8 with the SAS2308 HBA, so
      # x8 Gen3 is the ceiling: nvidia-smi's width max of 16 is the card's, not
      # the slot's, and comparing against it would fire forever. The generation
      # drops at idle by design, so both are only judged under sustained load.
      - alert: SolarGpuPcieDegraded
        expr: |
          (
            label_set(max_over_time(nvidia_gpu_pcie_link_width{host="solar"}[5m]) < 8, "link", "width")
            or label_set(max_over_time(nvidia_gpu_pcie_link_gen{host="solar"}[5m]) < 3, "link", "gen")
          )
          and on(host, gpu) min_over_time(nvidia_gpu_utilization_percent{host="solar"}[5m]) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "solar: GPU PCIe link {{ $labels.link }} below x8 Gen3 under load"
          description: "With the GPU over 50% busy, its PCIe link has run at {{ $labels.link }} {{ $value }} for 10 minutes (expected x8 Gen3, the slot's maximum). Compare `lspci -vv -s 01:00.0 | grep LnkSta` on clovis; a narrowed or downtrained link usually means the card is not seated, a riser fault, or AER errors in clovis' kernel log."
