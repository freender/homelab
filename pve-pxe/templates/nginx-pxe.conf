# /etc/nginx/sites-available/pxe - nginx HTTP server for PXE payload delivery.
# Written by homelab deploy; do not edit manually.

server {
    listen {{ MGMT_IP }}:80 default_server;
    listen 127.0.0.1:80;

    root /srv/pxe;
    autoindex off;

    # Serve iPXE menu and payload files
    location / {
        try_files $uri =404;
    }

    # Health check endpoint for pxe-autoupdate smoke test
    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    access_log /var/log/nginx/pxe-access.log;
    error_log  /var/log/nginx/pxe-error.log;
}
