# /etc/dnsmasq.d/pxe-mgmt.conf - dnsmasq proxyDHCP + TFTP config for saint.
# Written by homelab deploy; do not edit manually.
#
# proxyDHCP: UniFi remains the real DHCP server.
# dnsmasq announces PXE options to DHCP clients on the management network.

# Bind only to the management interface; never advertise on isolated bridge.
interface=eth0
bind-interfaces

# proxyDHCP: respond to existing DHCP clients on the management range.
dhcp-range={{ MGMT_NETWORK }},proxy

# TFTP: serve from /srv/tftp using tftp-secure (files must be owned dnsmasq:nogroup)
enable-tftp
tftp-root=/srv/tftp
tftp-secure

# PXE options: chain existing iPXE clients directly to the HTTP menu.
# UEFI and BIOS clients receive the matching binary via dhcp-match + dhcp-boot.
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://{{ MGMT_IP }}/boot.ipxe

# UEFI x86_64 (non-iPXE): load ipxe.efi over TFTP
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-boot=tag:efi-x86_64,ipxe.efi,,{{ MGMT_IP }}

# BIOS (non-iPXE): load undionly.kpxe over TFTP
dhcp-boot=tag:!efi-x86_64,tag:!ipxe,undionly.kpxe,,{{ MGMT_IP }}

# Logging
log-dhcp
