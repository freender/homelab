name: Mutation Sweep

# Deliberately NOT part of Validate. A sweep is tens of minutes against a suite that
# `./validate` clears in well under one, so gating a PR on it would make the fast check
# something contributors route around. It is also the wrong question: Validate gates a
# *change* ("is this diff safe to land"), while this ratchets the *suite* ("is it getting
# better"). Those run on different cadences, so they get different workflows.
#
# Because it is scheduled, a red run here cannot block anything -- the commit already
# landed. It is a notification, and it is meant to be read as one.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 06:37 UTC. Off the hour on purpose: GitHub's scheduler is congested at :00 and
    # delays or drops runs there. Runner is GitHub-hosted, so this has no relationship
    # to the homelab maintenance windows.
    - cron: '37 6 * * *'
  workflow_dispatch:

# A sweep can outlive its interval if the suite grows. Never stack two.
concurrency:
  group: mutation-sweep
  cancel-in-progress: false

jobs:
  mutants:
    name: Mutation Sweep
    runs-on: ubuntu-latest
    # A hung mutmut child would otherwise burn hours. The sweep took ~9 min locally at
    # --max-children 12; expect longer on a 4-core runner, but nowhere near this.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # `mutation` is a separate extra from `dev` precisely so the other jobs never pay
      # for mutmut; this is the one place both are wanted. Install stays non-editable,
      # matching local: tests/conftest.py inserts `<root>/src` at sys.path[0], which
      # under mutmut resolves to the copied `mutants/src` and so beats site-packages.
      # That path insertion is what makes the whole sweep meaningful -- see mutmut_env().
      - name: Install package, dev and mutation deps
        run: python -m pip install '.[dev,mutation]'

      # A fresh runner has no mutants/ tree, so every run is a full sweep from scratch.
      # The stale-results problem that `homelab mutants` guards locally cannot arise
      # here, and the fingerprint it writes is discarded with the runner.
      # `python -m homelab.cli`, not the `homelab` console script, and PYTHONPATH=src is
      # load-bearing: repo_root() is Path(__file__).parents[2], so under this
      # non-editable install the script resolves the "repo" to site-packages' parent and
      # sweeps nothing. Same workaround as the dry-run job in validate.yml. Setting it
      # here is safe precisely because mutmut_env() pops PYTHONPATH back off for the
      # mutmut children, which must not see the real src/.
      - name: Sweep and gate
        run: |
          PYTHONPATH=src python -m homelab.cli mutants \
            --max-children 4 2>&1 | tee mutation-report.txt
        env:
          # Same rationale as the pytest job in validate.yml: the sweep reruns the real
          # suite thousands of times, leak-check tests included, so it needs the same
          # environment or verdicts could differ from local for uninteresting reasons.
          HOMELAB_LEAK_DOMAINS: ${{ secrets.HOMELAB_LEAK_DOMAINS }}

      # Kept on failure too -- especially on failure. The report names which files
      # regressed and by how much, which is what decides whether the next step is
      # writing an assertion or re-baselining. Investigating an individual mutant still
      # needs `mutmut show <name>` against a local tree; the runner's is thrown away.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation-report.txt
          retention-days: 30
