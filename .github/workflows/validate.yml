name: Validate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and dev deps
        run: python -m pip install '.[dev]'
      - name: Run ruff
        run: python -m ruff check src tests

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and test deps
        run: python -m pip install '.[dev]'
      - name: Run pytest
        run: python -m pytest
        env:
          # Extra literal strings the leak check must ban. Kept in repo secrets so
          # the value itself is never committed. Unset is safe: the check still
          # runs its vendor-allowlist scan. GitHub sets CI=true, which makes the
          # checker redact findings so they never land in public build logs.
          HOMELAB_LEAK_DOMAINS: ${{ secrets.HOMELAB_LEAK_DOMAINS }}

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning
          ignore_paths: ".bin"

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint hosts.conf
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "hosts.conf"
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              truthy: disable

  dry-run:
    name: Dry Run Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Install from pyproject rather than a hand-maintained list, so a new dependency
      # cannot silently go missing here. Dev deps are needed because `validate` now
      # runs ruff and pytest as part of CI parity.
      - name: Install package and dev deps
        run: python -m pip install '.[dev]'
      - name: Dry-run all modules
        run: |
          export HOMELAB_OFFLINE=true
          PYTHONPATH=src python -m homelab.cli validate
        env:
          # See the pytest job: value lives in repo secrets, findings are redacted
          # in CI because build logs on a public repo are themselves public.
          HOMELAB_LEAK_DOMAINS: ${{ secrets.HOMELAB_LEAK_DOMAINS }}
