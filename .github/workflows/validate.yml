name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run ruff
        run: python -m ruff check src

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning
          ignore_paths: ".bin"

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint hosts.conf
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "hosts.conf"
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              truthy: disable

  dry-run:
    name: Dry Run Modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python deps
        run: python -m pip install click pyyaml jinja2 rich fabric
      - name: Install yq
        run: |
          mkdir -p .bin
          wget -qO .bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x .bin/yq
      - name: Dry-run all modules
        run: |
          export PATH="$PWD/.bin:$PATH"
          PYTHONPATH=src python -m homelab.cli validate
