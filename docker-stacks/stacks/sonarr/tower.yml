services:
  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    stop_grace_period: 20s
    networks:
      net.internal: {}
      net_overlay: {}
    restart: always
    mem_limit: 1g
    volumes:
      - /mnt/cache/appdata/sonarr:/config
      - /mnt/tank/media:/data
      - /mnt/cache/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
    labels:
      traefik.enable: 'true'
      traefik.http.routers.sonarr.entryPoints: 'https'
      traefik.http.routers.sonarr.middlewares: 'allow-local@file'
      traefik.http.services.sonarr.loadbalancer.server.port: '8989'

networks:
  net.internal:
    external: true
  net_overlay:
    external: true


