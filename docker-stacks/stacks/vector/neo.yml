networks:
  net.internal:
    external: true
  net_overlay:
    external: true

services:
  vector-neo:
    # Pinned: docker_logs keeps no checkpoint, so every image change costs a short
    # log gap (homelab-ops#363). Bump on purpose.
    image: timberio/vector:0.61.0-debian
    container_name: vector-neo
    restart: always
    stop_grace_period: 60s
    mem_limit: 512m
    environment:
      TZ: 'America/New_York'
    # The config is owned by the vector-config module, which reloads it with
    # SIGHUP. Metrics on :9598 are scraped over net_overlay; no host port.
    command: ["--config", "/etc/vector/vector.yaml"]
    # neo has no geoipupdate stack, so no GeoIP mount.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
      - /mnt/cache/appdata/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /mnt/cache/appdata/vector/data:/var/lib/vector
      # journald source (homelab-ops#375): /var/log/journal comes with /var/log;
      # the bin dir holds vector-config's journalctl-catchup wrapper.
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /mnt/cache/appdata/vector/bin:/etc/vector/bin:ro
    networks:
      net.internal: {}
      net_overlay: {}
