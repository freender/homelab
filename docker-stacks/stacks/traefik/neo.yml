# neo is a cert FOLLOWER: it runs no ACME resolver and mounts no acme.json.
# It serves the cert helm's traefik-cert-exporter-helm publishes into the
# Sentinel Redis (homelab-ops#318).
networks:
  net.internal:
    name: net.internal
  net_overlay:
    external: true

services:
  crowdsec-neo:
    image: ghcr.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec-neo
    init: true
    stop_grace_period: 20s
    restart: always
    mem_limit: 1g
    user: '1000:1000'
    # neo's docker group: acquis.yaml reads traefik-neo's stdout through the
    # socket, since Traefik writes access logs to stdout, not a file.
    group_add: ['991']
    environment:
      TZ: 'America/New_York'
      COLLECTIONS: 'crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve'
      POSTOVERFLOWS: 'crowdsecurity/rdns'
    volumes:
      - /mnt/cache/appdata/crowdsec/data:/var/lib/crowdsec/data
      - /mnt/cache/appdata/crowdsec:/etc/crowdsec
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The `crowdsec` alias keeps the bouncer endpoint in fileConfig.yml working
    # now that the container is host-suffixed like every other service.
    networks:
      net.internal:
        aliases:
          - crowdsec
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Sentinel-managed Redis holding every host's routes (homelab-ops#318). Each
  # Traefik reads it through the Sentinels; each traefik-kop-<host> writes to it.
  # redis.conf is seeded once, after which Sentinel's CONFIG REWRITE owns it.
  # The image entrypoint is bypassed on purpose: it appends --loadmodule for the
  # bundled modules, CONFIG REWRITE persists those, and the next start loads them
  # twice and aborts (homelab-ops#320). It also does not chown a bind-mounted /data.
  traefik-kv-neo:
    image: redis:8.10.3-alpine
    container_name: traefik-kv-neo
    init: true
    stop_grace_period: 20s
    restart: always
    mem_limit: 1g
    env_file:
      - .env
    environment:
      TZ: 'America/New_York'
      ANNOUNCE: traefik-kv-neo
      SEED_REPLICAOF: 'traefik-kv-tower'
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/redis.conf ]; then
          cat > /data/redis.conf <<EOF
        port 6379
        dir /data
        requirepass $${REDIS_PASS}
        masterauth $${REDIS_PASS}
        notify-keyspace-events AKE
        replica-serve-stale-data no
        replica-announce-ip $${ANNOUNCE}
        appendonly yes
        appendfsync everysec
        EOF
          [ -n "$${SEED_REPLICAOF}" ] && echo "replicaof $${SEED_REPLICAOF} 6379" >> /data/redis.conf
        fi
        sed -i '/^loadmodule /d' /data/redis.conf
        chown -R redis:redis /data
        chmod 600 /data/*.conf
        exec setpriv --reuid redis --regid redis --clear-groups redis-server /data/redis.conf
    volumes:
      - /mnt/cache/appdata/traefik/redis:/data
    networks:
      net_overlay: {}
    healthcheck:
      # Grep for PONG, not the exit code: redis-cli exits 0 on NOAUTH/WRONGPASS.
      # REDISCLI_AUTH keeps the password out of argv.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASS\" redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # No requirepass on Sentinel: traefik-kop has no Sentinel-password option.
  traefik-sentinel-neo:
    image: redis:8.10.3-alpine
    container_name: traefik-sentinel-neo
    init: true
    stop_grace_period: 20s
    restart: always
    mem_limit: 256m
    env_file:
      - .env
    environment:
      TZ: 'America/New_York'
      ANNOUNCE: traefik-sentinel-neo
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/sentinel.conf ]; then
          cat > /data/sentinel.conf <<EOF
        port 26379
        dir /data
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel announce-ip $${ANNOUNCE}
        sentinel monitor traefik traefik-kv-tower 6379 2
        sentinel auth-pass traefik $${REDIS_PASS}
        sentinel down-after-milliseconds traefik 5000
        sentinel failover-timeout traefik 15000
        sentinel parallel-syncs traefik 1
        EOF
        fi
        sed -i '/^loadmodule /d' /data/sentinel.conf
        chown -R redis:redis /data
        chmod 600 /data/*.conf
        exec setpriv --reuid redis --regid redis --clear-groups redis-server /data/sentinel.conf --sentinel
    volumes:
      - /mnt/cache/appdata/traefik/sentinel:/data
    networks:
      net_overlay: {}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Publishes this host's labelled containers into the Sentinel master, wherever
  # it currently is -- so no depends_on on the local kv (homelab-ops#319).
  # REDIS_PASS comes from env_file; kop has no Sentinel-password option.
  traefik-kop-neo:
    image: ghcr.io/jittering/traefik-kop:latest
    container_name: traefik-kop-neo
    hostname: neo
    init: true
    stop_grace_period: 20s
    restart: always
    mem_limit: 1g
    env_file:
      - .env
    environment:
      TZ: 'America/New_York'
      KOP_HOSTNAME: neo
      REDIS_SENTINEL_ADDRS: traefik-sentinel-tower:26379,traefik-sentinel-helm:26379,traefik-sentinel-neo:26379
      REDIS_SENTINEL_MASTER: traefik
      SKIP_REPLACE: 1
      KOP_POLL_INTERVAL: 60
      DOCKER_CONFIG: /config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/cache/appdata/traefik/kop/config.yaml:/config.yaml:ro
    networks:
      net_overlay: {}

  traefik-neo:
    image: ghcr.io/traefik/traefik:latest
    container_name: traefik-neo
    init: true
    stop_grace_period: 20s
    restart: always
    mem_limit: 1g
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - .env
    environment:
      TZ: 'America/New_York'
    volumes:
      - /mnt/cache/appdata/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Directory, not the single file: fileconfig-sync (and most editors) replace
      # fileConfig.yml, and a single-file bind mount keeps serving the old inode
      # until restart (homelab-ops#199). traefik.yml points at dynamic/fileConfig.yml.
      - /mnt/cache/appdata/traefik:/etc/traefik/dynamic:ro
      - /mnt/cache/appdata/traefik/plugins-storage:/plugins-storage:rw
    networks:
      net.internal: {}
      net_overlay: {}
    labels:
      traefik.enable: 'true'
      traefik.http.routers.traefik-neo.rule: Host(`traefik-neo.${DOMAIN}`)
      traefik.http.routers.traefik-neo.entryPoints: 'https'
      traefik.http.routers.traefik-neo.service: 'api@internal'
      traefik.http.routers.traefik-neo.middlewares: 'allow-local@file'
      traefik.http.services.traefik-neo.loadbalancer.server.port: '8183'
      traefik.http.routers.traefik-neo-ping.rule: Host(`traefik-neo.${DOMAIN}`) && PathPrefix(`/ping`)
      traefik.http.routers.traefik-neo-ping.entryPoints: 'https'
      traefik.http.routers.traefik-neo-ping.service: 'ping@internal'
      traefik.http.routers.traefik-neo-ping.middlewares: 'allow-cdn-and-local@file'
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      crowdsec-neo:
        condition: service_healthy
