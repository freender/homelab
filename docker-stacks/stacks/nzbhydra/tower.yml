services:
  nzbhydra:
    image: ghcr.io/linuxserver/nzbhydra2:latest
    container_name: nzbhydra
    stop_grace_period: 20s
    networks:
      net.internal: {}
      net_overlay: {}
    restart: always
    mem_limit: 1g
    volumes:
      - /mnt/cache/appdata/nzbhydra:/config
      - /mnt/cache/media/downloads:/data/downloads
      - /mnt/cache/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
    labels:
      traefik.enable: 'true'
      traefik.http.routers.nzbhydra.entryPoints: 'https'
      traefik.http.routers.nzbhydra.middlewares: 'allow-local@file'
      traefik.http.services.nzbhydra.loadbalancer.server.port: '5076'

networks:
  net.internal:
    external: true
  net_overlay:
    external: true


