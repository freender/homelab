services:
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:stable
    environment:
      TZ: 'America/New_York'
      PRIMARY_INTERFACE: nic0
    # Host networking is required for Matter mDNS/IPv6. Keep the unauthenticated
    # WebSocket/dashboard off the LAN: loopback for the healthcheck, net.internal's
    # gateway so homeassistant (macvlan, cannot reach the host IP) can connect.
    # Repeated flags, not LISTEN_ADDRESS: the stable image does not split commas.
    command: --listen-address 127.0.0.1 --listen-address 172.18.0.1
    volumes:
      - /mnt/cache/appdata/matter-server/data:/data
    restart: always
    mem_limit: 512m
    network_mode: host
