services:
  watchstate:
    image: ghcr.io/arabcoders/watchstate:latest
    container_name: watchstate
    init: true
    stop_grace_period: 20s
    user: "1000:1000"
    env_file:
      - .env
    networks:
      net.internal:
      net_overlay:
    restart: always
    mem_limit: 1g
    volumes:
      - /mnt/cache/appdata/watchstate/data:/config:rw
    environment:
      TZ: America/New_York
    labels:
      traefik.enable: 'true'
      traefik.http.routers.watchstate.entryPoints: 'https'
      traefik.http.routers.watchstate.middlewares: 'allow-local@file'
      traefik.http.services.watchstate.loadbalancer.server.port: '8080'

networks:
  net.internal:
    external: true
  net_overlay:
    external: true
