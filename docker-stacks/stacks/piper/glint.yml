services:
  piper:
    # CPU on purpose: the GPU added 60-130 ms before first audio on every voice
    # (homelab-ops#307).
    image: rhasspy/wyoming-piper:2.5.2
    container_name: piper
    stop_grace_period: 20s
    restart: always
    ports:
      - '10200:10200'
    volumes:
      - /mnt/cache/appdata/piper/data:/data
    command: --voice en_US-lessac-high
