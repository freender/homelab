services:
  gluetun:
    image: ghcr.io/qdm12/gluetun:v3
    container_name: gluetun
    networks:
      net.internal:
        aliases:
          - qbittorrent
      net_overlay:
        aliases:
          - qbittorrent
    restart: always
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    volumes:
      - /mnt/cache/appdata/qbittorrent/gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_IMPLEMENTATION: kernelspace
      SERVER_COUNTRIES: United States
      VPN_PORT_FORWARDING: 'on'
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        wget -qO- --retry-connrefused --tries=60 --waitretry=5
        --post-data 'json={"listen_port":{{PORT}}}'
        http://127.0.0.1:8180/api/v2/app/setPreferences
    labels:
      traefik.enable: 'true'
      traefik.http.routers.qbittorrent.entryPoints: 'https'
      traefik.http.routers.qbittorrent.middlewares: 'allow-local@file'
      traefik.http.routers.qbittorrent.rule: Host(`qbittorrent.${DOMAIN}`)
      traefik.http.services.qbittorrent.loadbalancer.server.port: '8180'

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: always
    mem_limit: 5g
    cpus: 4
    volumes:
      - /mnt/cache/appdata/qbittorrent:/config
      - /mnt/cache/downloads:/downloads
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: '000'
      WEBUI_PORT: 8180
      DOCKER_MODS: ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest

networks:
  net.internal:
    external: true
  net_overlay:
    external: true
