services:
  qbittorrent:
    image: ghcr.io/binhex/arch-qbittorrentvpn:5.1
    container_name: qbittorrent
    init: true
    stop_grace_period: 20s
    networks:
      net.internal: {}
      net_overlay: {}
    restart: always
    privileged: true
    mem_limit: 5g
    cpus: 4
    env_file:
      - .env
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /mnt/cache/appdata/qbittorrent:/config
      - /mnt/cache/media/downloads:/data/downloads
      - /mnt/cache/downloads:/downloads
    environment:
      VPN_ENABLED: yes
      VPN_PROV: protonvpn
      VPN_CLIENT: wireguard
      STRICT_PORT_FORWARD: yes
      ENABLE_PRIVOXY: no
      ENABLE_SOCKS: no
      SOCKS_USER: admin
      SOCKS_PASS: socks
      LAN_NETWORK: 10.0.40.0/24
      WEBUI_PORT: 8180
      DEBUG: false
      VPN_USER: ${VPN_USER}
      VPN_PASS: ${VPN_PASS}
      ENABLE_STARTUP_SCRIPTS: no
      USERSPACE_WIREGUARD: no
      NAME_SERVERS: 1.1.1.1,1.0.0.1
      PUID: 1000
      PGID: 1000
      UMASK: 000
    labels:
      traefik.enable: 'true'
      traefik.http.routers.qbittorrent.entryPoints: 'https'
      traefik.http.routers.qbittorrent.middlewares: 'allow-local@file'
      traefik.http.services.qbittorrent.loadbalancer.server.port: '8180'

networks:
  net.internal:
    external: true
  net_overlay:
    external: true
