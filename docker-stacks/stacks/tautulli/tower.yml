services:
  tautulli:
    image: ghcr.io/linuxserver/tautulli:latest
    container_name: tautulli
    stop_grace_period: 20s
    networks:
      net.internal: {}
      net_overlay: {}
    restart: always
    mem_limit: 1g
    volumes:
      - /mnt/cache/appdata/tautulli:/config
      - /mnt/cache/appdata/plex/Library/Application Support/Plex Media Server/Logs/:/logs
    environment:
      PUID: 1000
      PGID: 1000
    labels:
      traefik.enable: 'true'
      traefik.http.routers.tautulli.entryPoints: 'https'
      traefik.http.routers.tautulli.middlewares: 'allow-local@file'
      traefik.http.services.tautulli.loadbalancer.server.port: '8181'

networks:
  net.internal:
    external: true
  net_overlay:
    external: true


