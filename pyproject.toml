[project]
name = "homelab"
version = "0.1.0"
description = "Python orchestration for homelab deployments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1,<9",
    "fabric>=3.2,<4",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "rich>=13.9,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.11,<0.12",
]
# Deliberately not in `dev`: a full sweep takes ~30 minutes, so it is an
# out-of-band check run by hand (`homelab mutants`), never part of `./validate`.
mutation = [
    "mutmut>=3.8,<4",
]

[project.scripts]
homelab = "homelab.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# `homelab_install` also lives under src/ (so mutmut keys it correctly), but it is the
# remote installer library: staged onto targets from the repo tree, never imported by
# the `homelab` CLI. Listed exactly — a `homelab*` glob would match it too.
include = ["homelab", "homelab.*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# `efibootmgr -v` output is reproduced verbatim as fixtures in this file. A UEFI
# device path carrying a partition GUID is simply longer than 100 characters, and
# rewrapping it with implicit string concatenation would destroy the one property
# the fixtures exist for: being byte-identical to what the real tool prints, so a
# reading captured from a live host can be diffed straight into the test. Scoped
# to this single file, not to tests/ generally.
"tests/test_boot_entry_exporter.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=homelab --cov=homelab_install --cov-report=term-missing"

[tool.coverage.run]
# `homelab_install` (src/homelab_install/) is the remote installer library. It is not
# an installed package (see [tool.setuptools.packages.find]); `tests/conftest.py` is
# what puts `src` on `sys.path` so it is importable and measured here.
source = ["homelab", "homelab_install"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mutmut]
# mutmut runs the suite from a copied `mutants/` tree, so the whole package has
# to be walked or `homelab.modules.*` stops being importable. Files outside
# `only_mutate` are copied verbatim instead of mutated, which is what makes a
# narrow, honest scope possible without breaking the copy.
source_paths = ["src/homelab", "src/homelab_install"]

# Scope, and the single owner of that fact — `homelab mutants` adds no default
# of its own. These are the pure-logic paths where a wrong answer is *silent*:
# inventory parsing, staging plans, and the quality gate itself return a value
# rather than touching a host, so a subtly wrong result propagates into a deploy
# instead of raising. The Fabric and subprocess surfaces fail loudly and are
# better served by the tests that already exist. `homelab_install` is the
# exception that proves the rule: it runs as root on every target, and a wrong
# mode, path or "changed" verdict there is silent too (freender/homelab-ops#37).
only_mutate = [
    "src/homelab/crap.py",
    "src/homelab/hosts.py",
    "src/homelab/leakcheck.py",
    "src/homelab/module_support.py",
    "src/homelab/modules/pve_guest/drift.py",
    "src/homelab/modules/pve_guest/pveconf.py",
    "src/homelab/modules/pve_guest/spec.py",
    "src/homelab/modules/zfs_automation/normalize.py",
    "src/homelab/op_secrets.py",
    "src/homelab_install/__init__.py",
    "src/homelab_install/changes.py",
    "src/homelab_install/context.py",
    "src/homelab_install/env.py",
    "src/homelab_install/errors.py",
    "src/homelab_install/files.py",
    "src/homelab_install/log.py",
    "src/homelab_install/main.py",
    "src/homelab_install/osinfo.py",
    "src/homelab_install/packages.py",
    "src/homelab_install/systemd.py",
]

timeout_multiplier = 60.0

# Tests resolve ROOT as `tests/..`, which under mutmut is `mutants/`, so every
# payload directory a test reads has to be copied in beside them. Enforced by
# tests/test_mutants.py::test_also_copy_covers_every_payload_directory — without
# that check a newly added module would silently break the sweep.
also_copy = [
    "hosts.conf",
    "constraints.txt",
    "crap-baseline.json",
    "mutation-baseline.json",
    "backup-excludes",
    "apcupsd",
    "apt-upgrade",
    "base-packages",
    "docker",
    "docker-stacks",
    "keepalived",
    "metrics-exporters",
    "monitoring-config",
    "pbs-client-backup",
    "pve-autoinstall",
    "pve-backup",
    "pve-gpu-passthrough",
    "pve-http-boot",
    "pve-interface-pinning",
    "pve-lxc-pre-replication-patch",
    "pve-notifications",
    "pve-postinstall",
    "pve-postinstall-webhook",
    "pve-upgrade",
    "pve-zfs-large-block-patch",
    "pve-zfs-migration-sync-patch",
    "secrets",
    "ssh-config",
    "ubuntu-setup",
    "vmalert-rules",
    "wsl-conf",
    "zfs-automation",
]
