# Homelab secrets catalog.
#
# Each entry maps a stable name to an `op inject` template under
# secrets/templates/. Templates contain `op://Homelab/<Item>/<field>` references
# that resolve at deploy time. No secret values live in this repo or on
# riven disk; rendered files exist only in /dev/shm during a deploy.
#
# Use `homelab secrets doctor` to verify every entry resolves.
# Use `homelab secrets render` to materialize all entries for inspection.

secrets:
  pbs-backup-main:
    template: secrets/templates/pbs-backup-main.env.tpl
    description: PBS token for xur backup/freender namespace (used by pve-backup).

  pbs-backup-cinci:
    template: secrets/templates/pbs-backup-cinci.env.tpl
    description: PBS token for zavala backup/freender namespace (used by pve-backup on osiris).

  pbs-host-backup-cinci:
    template: secrets/templates/pbs-host-backup-cinci.env.tpl
    description: PBS host-backup token for cinci backup namespace on the local PBS.

  pbs-host-backup-cottonwood:
    template: secrets/templates/pbs-host-backup-cottonwood.env.tpl
    description: PBS host-backup token for cottonwood local PBS (pbs-client-backup to localhost).

  pbs-backup-xur-cinci:
    template: secrets/templates/pbs-backup-xur-cinci.env.tpl
    description: PBS API token for cinci pushing to xur backup/cinci namespace.

  pbs-backup-xur-cottonwood:
    template: secrets/templates/pbs-backup-xur-cottonwood.env.tpl
    description: PBS API token for cottonwood pushing to xur backup/cottonwood namespace.

  telegram:
    template: secrets/templates/telegram.env.tpl
    description: Telegram bot token + chat id for homelab notifications (apcupsd, ubuntu-setup).

  keepalived:
    template: secrets/templates/keepalived.env.tpl
    description: Keepalived healthcheck hostnames and URLs (tower/helm/neo Traefik probes).

  network-macs:
    template: secrets/templates/network-macs.env.tpl
    description: Pinned primary NIC MAC addresses for ubuntu-setup network rules.

  zfs-push-key:
    template: secrets/templates/zfs-push-key.env.tpl
    description: SSH private key for PVE source-host ZFS push replication.

  pve-pxe-token:
    template: secrets/templates/pve-pxe-token.env.tpl
    description: PDM answer-auth token for arc PXE automated install payload (pve-pxe module).

  pdm-deploy-token:
    template: secrets/templates/pdm-deploy-token.env.tpl
    description: PDM API token (root@pam!homelab-deploy) for pve-autoinstall module to manage prepared answers on arc.

  pve-postinstall-webhook:
    template: secrets/templates/pve-postinstall-webhook.env.tpl
    description: Auth token for Proxmox post-install webhooks that trigger homelab deploys on arc.

  pve-root-password:
    template: secrets/templates/pve-root-password.env.tpl
    description: Shared plaintext root password for PVE nodes; hashed at deploy time by pve-autoinstall.

  pve-root-password-cinci:
    template: secrets/templates/pve-root-password-cinci.env.tpl
    description: Cinci plaintext root password for PVE rebuild; hashed at deploy time by pve-autoinstall.

  pve-root-password-cottonwood:
    template: secrets/templates/pve-root-password-cottonwood.env.tpl
    description: Cottonwood plaintext root password for PVE rebuild; hashed at deploy time by pve-autoinstall.
