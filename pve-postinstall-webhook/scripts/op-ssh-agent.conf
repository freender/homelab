# 1Password CLI service-account SSH key loader config for arc.
# Token file must contain only the service account token and must be mode 0600.
OP_SERVICE_ACCOUNT_TOKEN_FILE="/root/.config/op/service-account-token"

# Service account refs. Keep this vault scoped to the two default keys only.
OP_SSH_MAIN_REF="op://Homelab/SSH Key - Homelab/private key"
OP_SSH_PVE_REF="op://Homelab/SSH Key - Homelab-Infra/private key"

# Safety guard: if this item is visible to the service account, refuse to load.
OP_SSH_FORBIDDEN_OFFSITE_VAULT="Homelab"
OP_SSH_FORBIDDEN_OFFSITE_ITEM="SSH Key - Offsite"

OP_SSH_MAIN_TTL="24h"
OP_SSH_PVE_TTL="8h"

# arc has no offsite access and no addoffsitekey/dropoffsitekey helpers -- it
# is a headless automation host, not an interactive SSH-agent workstation.

# Note: this file is deployed as /root/.config/op-ssh-agent.env on arc (the
# name op-ssh-add's default OP_SSH_CONFIG expects). It is named .conf here in
# the repo, not .env, only because the repo's .gitignore blanket-excludes
# **/*.env for the real-secrets convention -- this file carries no secrets,
# just non-secret 1Password item refs and TTLs.
