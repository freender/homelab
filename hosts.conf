      sshkey: homelab
  features:
    keepalived:
      instance_name: helm
      interface: nic0
      healthcheck_host_env: KEEPALIVED_HELM_HEALTHCHECK_HOST
      healthcheck_url_env: KEEPALIVED_HELM_HEALTHCHECK_URL
