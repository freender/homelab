# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  type: pve
  features:
    pve-exporters:
    ceph:
    pve-gpu-passthrough:
      pci_ids: "8086:3e92"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
      proxmox_backup_client:
        schedule: "00:30"
        repository: pve-backup@pbs@xur.freender.internal:backup-main
        secret_profile: backup-main
        backup_id: pve-cluster
        archive_name: etc-pve
    apt-upgrade:

bray:
  type: pve
  features:
    pve-exporters:
    ceph:
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    apt-upgrade:

clovis:
  type: pve
  features:
    pve-exporters:
    ceph:
    pve-gpu-passthrough:
      pci_ids: "10de:2208,10de:1aef,8086:9bc5"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    apt-upgrade:

osiris:
  type: pve
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      proxmox_backup_client:
        schedule: "00:30"
        repository: xur-sync@pbs@cinci.internal:backup-cinci
        secret_profile: backup-cinci
        backup_id: pve-standalone
        archive_name: etc-pve
      pbs_setup:
        storages:
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: "22:30"
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
    apt-upgrade:
      schedule: "09:00"
      autoupgrade: true

# -----------------------------------------------------------------------------
# TrueNAS
# -----------------------------------------------------------------------------

tower:
  type: truenas
  features:
    docker:
      user: freender
      owner: 1000
      group: 1000

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  type: ubuntu
  features:
    docker:
      user: denysc
      owner: 1000
      group: 1000

cinci:
  type: ubuntu
  features:
    docker:
      user: sysadm
      owner: 1000
      group: 1000

zavala:
  type: ubuntu
  features:

helm:
  type: ubuntu
  features:
    ssh:
    docker:
      user: freender
      backup: true

# -----------------------------------------------------------------------------
# LXC Containers
# -----------------------------------------------------------------------------

xur:
  type: pbs
  features:

orbit:
  type: ubuntu
  features:
    docker:
      user: root

riven:
  type: ubuntu
  features:
    ssh:


# -----------------------------------------------------------------------------
# MacOS
# -----------------------------------------------------------------------------

exo:
  type: macos
  features:
    ssh:
