        weekly: 4
        monthly: 2
      replication_jobs:
        pull-osiris:
          schedule: '*-*-* 02:00:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=osiris
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_ed25519
          plans:
            - source: zfs-pull@10.0.0.80:vm-disks/tower/appdata
              target: cache/tower/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/helm/appdata
              target: cache/helm/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/neo/appdata
              target: cache/neo/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/neo/pictures
              target: cache/neo/pictures
            - source: zfs-pull@10.0.0.80:vm-disks/neo/documents
              target: cache/neo/documents
            - source: zfs-pull@10.0.0.80:vm-disks/neo/logseq
              target: cache/neo/logseq
            - source: zfs-pull@10.0.0.80:vm-disks/neo/obsidian
              target: cache/neo/obsidian
            - source: zfs-pull@10.0.0.80:vm-disks/neo/games
              target: cache/neo/games
      pull_source_access:
        user: zfs-pull
        datasets:
          - cache/appdata
        allowed_pullers:
          - name: osiris
            from: 10.66.67.2
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvtnndVjVll8xAMaesmHpXyj53rRQrPgluXQRJcZ3Wu homelab-zfs-pull osiris cinci 20260430
    apt-upgrade:
      schedule: '*-*-* 08:04:00'
      autoupgrade: true

helm:
  config:
    type: ubuntu
    hostname: helm.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: helm
      interface: nic0
      healthcheck_host_env: KEEPALIVED_HELM_HEALTHCHECK_HOST
      healthcheck_url_env: KEEPALIVED_HELM_HEALTHCHECK_URL
      virtual_router_id: 50
      priority: 100
      advert_interval: 1
      unicast_src_ip: 10.0.40.245
      unicast_peers:
        - 10.0.40.10
        - 10.0.40.18
      virtual_ips:
        - 10.0.40.15 dev nic0
    docker:
      update_schedule: '*-*-* 02:00:00'
      run_on_boot: true
    apt-upgrade:
      schedule: '*-*-* 08:01:00'
      autoupgrade: true

# -----------------------------------------------------------------------------
# LXC Containers
# -----------------------------------------------------------------------------

xur:
  config:
    type: pbs
    hostname: xur.freender.internal
    user: root
    sshkey: infra
  features:

deepstone:
  config:
    type: ubuntu
    hostname: deepstone.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      hostname: timemachine.freender.internal
      user: freender
      sshkey: homelab
  features:

neo:
  config:
    type: ubuntu
    hostname: neo.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: neo
      interface: eth0
      healthcheck_host_env: KEEPALIVED_NEO_HEALTHCHECK_HOST
      healthcheck_url_env: KEEPALIVED_NEO_HEALTHCHECK_URL
      virtual_router_id: 50
      priority: 99
      advert_interval: 1
      unicast_src_ip: 10.0.40.18
      unicast_peers:
        - 10.0.40.10
        - 10.0.40.245
      virtual_ips:
        - 10.0.40.15 dev eth0
    docker:
      run_on_boot: true
      update_schedule: '*-*-* 23:30:00'
    apt-upgrade:
      schedule: '*-*-* 08:06:00'
      autoupgrade: true

tower:
  config:
    type: ubuntu
    hostname: tower.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  media_storage_ref: ace
  media_storage:
    export:
      data_mount_prefix: /mnt/disk
      parity_mount_prefix: /mnt/parity
      cache_media_path: /mnt/bulk/media
      merged_media_path: /mnt/user/media
      hdd_only_media_path: /mnt/user0/media
  features:
    keepalived:
      instance_name: homelab
      interface: eth0
      healthcheck_host_env: KEEPALIVED_TOWER_HEALTHCHECK_HOST
      healthcheck_url_env: KEEPALIVED_TOWER_HEALTHCHECK_URL
      virtual_router_id: 50
      priority: 101
      advert_interval: 1
      unicast_src_ip: 10.0.40.10
      unicast_peers:
        - 10.0.40.245
        - 10.0.40.18
      virtual_ips:
        - 10.0.40.15 dev eth0
    docker:
      run_on_boot: true
      update_schedule: '*-*-* 02:00:00'
      syncthing_unpause_schedule: '*-*-* 02:15:00'
      syncthing_pause_schedule: '*-*-* 07:00:00'
    apt-upgrade:
      schedule: '*-*-* 08:00:00'
      autoupgrade: true
    media-pool:
      create_policy: ff
      min_free_space: 90G
      hdd_only_min_free_space: 90G
    media-mover:
      manage_timer: false
      plex_mount_root: /data
      plex_url: http://tower.freender.internal:32400
      tautulli_config_path: /mnt/cache/appdata/tautulli/config.ini
      ondeck_enabled: true
      ondeck_budget: 1T
      ondeck_tv_prefetch_episodes: 2
      ondeck_include_movies: true
      ondeck_movie_max_age_days: 30
      ondeck_series_max_age_days: 30
      recent_movie_retention_days: 14
      recent_tv_retention_days: 14
      cache_min_free_space: 500G
      cache_target_free_space: 600G
      state_file: /var/lib/homelab-media-mover/state.json
      ignore_relative_paths:
        - downloads
    snapraid:
      version: 14.4-1
      deb_url: https://github.com/amadvance/snapraid/releases/download/v14.4/snapraid_14.4-1_amd64.deb
      sha256: 50863cc6067f23449ba67e0cae456d74a1eadf2a19612a70067bb4e7cc88131c
      sync_schedule: 'Mon..Sat *-*-* 00:00:00'
      scrub_schedule: 'Sun *-*-* 00:00:00'
      orchestrate_media_mover: true
