# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
      mounts:
        - label: data1
          path: /disk1
        - label: data2
          path: /disk2
        - label: data3
          path: /disk3
        - label: data4
          path: /disk4
        - label: data5
          path: /disk5
        - label: data6
          path: /disk6
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pve-backup:
      proxmox_backup_client:
        schedule: '*-*-* 00:30:00'
        repository: pve-backup@pbs@xur.freender.internal:backup-main
        secret_profile: backup-main
        backup_id: pve-cluster
        archive_name: etc-pve
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: vm-disks/subvol-101-disk-1
      pull_source_access:
        datasets:
          - vm-disks/subvol-101-disk-1
        allowed_pullers:
          - name: cinci
            from: 10.0.1.6
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM07Dv4fxB9wMkLHX5U0sRf0ltXWrorxeqx9ERuYemLf homelab-zfs-pull cinci 20260426
          - name: cottonwood
            from: 10.0.1.5
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIADiaKCXmChotWjnk7rHJq1g6+inKPz22yD2sd9lJGWs homelab-zfs-pull tower cottonwood 20260426
          - name: osiris
            from: 10.0.0.80
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZUChNs2mr3IP00sWta7mkFTO5bYBCiAzgiVSR+t9+g homelab-zfs-pull osiris ace 20260427
    pve-gpu-passthrough:

bray:
  config:
    type: pve
    hostname: bray.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: vm-disks/subvol-108-disk-1
        - dataset: vm-disks/subvol-108-disk-2
        - dataset: vm-disks/subvol-108-disk-3
        - dataset: vm-disks/subvol-108-disk-4
        - dataset: vm-disks/subvol-108-disk-5
        - dataset: vm-disks/subvol-108-disk-6
      pull_source_access:
        datasets:
          - vm-disks/subvol-108-disk-1
          - vm-disks/subvol-108-disk-2
          - vm-disks/subvol-108-disk-3
          - vm-disks/subvol-108-disk-4
          - vm-disks/subvol-108-disk-5
          - vm-disks/subvol-108-disk-6
        allowed_pullers:
          - name: osiris
            from: 10.0.0.80
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHYT9WOutoyAs/qXBLcp5g4xojo9zKrIWeKD1yXDxrzL homelab-zfs-pull osiris bray 20260429
    pve-gpu-passthrough:

clovis:
  config:
    type: pve
    hostname: clovis.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    pve-gpu-passthrough:
      isolate_host_gpu: false
      pci_ids: "10de:2208,10de:1aef"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: vm-disks/subvol-107-disk-1
      pull_source_access:
        datasets:
          - vm-disks/subvol-107-disk-1
        allowed_pullers:
          - name: osiris
            from: 10.0.0.80
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMjMGb9/YmhE4jO5vbw5hTAoy1ImnGPxI7UxiQ0zgaLs homelab-zfs-pull osiris clovis 20260430

osiris:
  config:
    type: pve
    hostname: osiris.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
    pve-gpu-passthrough:
    zfs-automation:
      manage_snapshots: false
      snapshot_plans: []
      manage_scrub: false
      manage_health_check: false
      replication_defaults:
        schedule: '*-*-* 00:30:00'
        syncoid_options:
          - --no-sync-snap
          - --no-privilege-elevation
      replication_jobs:
        pull-bray:
          syncoid_options:
            - --identifier=bray
            - --sshkey=/root/.ssh/homelab-zfs-pull_bray_ed25519
          plans:
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-1
              target: vm-disks/neo/appdata
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-2
              target: vm-disks/neo/pictures
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-3
              target: vm-disks/neo/documents
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-4
              target: vm-disks/neo/obsidian
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-5
              target: vm-disks/neo/logseq
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-6
              target: vm-disks/neo/games
        pull-clovis:
          syncoid_options:
            - --identifier=clovis
            - --sshkey=/root/.ssh/homelab-zfs-pull_clovis_ed25519
          plans:
            - source: zfs-pull@10.0.0.60:vm-disks/subvol-107-disk-1
              target: vm-disks/helm/appdata
        pull-ace:
          syncoid_options:
            - --identifier=ace
            - --sshkey=/root/.ssh/homelab-zfs-pull_ace_ed25519
          plans:
            - source: zfs-pull@10.0.0.20:vm-disks/subvol-101-disk-1
              target: vm-disks/tower/appdata
        pull-cinci:
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=cinci
            - --sshkey=/root/.ssh/homelab-zfs-pull_cinci_ed25519
          plans:
            - source: zfs-pull@cinci.internal:cache/appdata
              target: vm-disks/cinci/appdata
        pull-cottonwood:
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=cottonwood
            - --sshkey=/root/.ssh/homelab-zfs-pull_cottonwood_ed25519
          plans:
            - source: zfs-pull@cottonwood.internal:cache/appdata
              target: vm-disks/cottonwood/appdata
            - source: zfs-pull@cottonwood.internal:cache/pictures
              target: vm-disks/cottonwood/pictures
      pull_source_access:
        datasets:
          - vm-disks/tower/appdata
          - vm-disks/helm/appdata
          - vm-disks/neo/appdata
          - vm-disks/neo/pictures
          - vm-disks/neo/documents
          - vm-disks/neo/logseq
          - vm-disks/neo/obsidian
          - vm-disks/neo/games
        allowed_pullers:
          - name: cinci
            from: 10.0.1.6
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM07Dv4fxB9wMkLHX5U0sRf0ltXWrorxeqx9ERuYemLf homelab-zfs-pull cinci 20260426
          - name: cottonwood
            from: 10.0.1.5
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIADiaKCXmChotWjnk7rHJq1g6+inKPz22yD2sd9lJGWs homelab-zfs-pull tower cottonwood 20260426
    pve-backup:
      proxmox_backup_client:
        schedule: '*-*-* 00:30:00'
        repository: xur-sync@pbs@cinci.internal:backup-cinci
        secret_profile: backup-cinci
        backup_id: pve-standalone
        archive_name: etc-pve
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
            fingerprint: "d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7"
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
          - schedule: '*-*-* 22:30:00'
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  config:
    type: ubuntu
    hostname: cottonwood.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: denysc
      sshkey: homelab
  features:
    docker:
      update_schedule: '*-*-* 02:00:00'
    ubuntu-setup:
      deploy_user: denysc
      timezone: America/Denver
      wireguard: true
      network:
        pin_interface:
          name: nic0
    zfs-automation:
      # Keep cottonwood snapshots at 00:00 Eastern; systemd honors the explicit timezone on Mountain-time cottonwood.
      snapshot_schedule: '*-*-* 00:00:00 America/New_York'
      snapshot_defaults:
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: cache/appdata
        - dataset: cache/pictures
      replication_defaults:
        # Keep offsite pulls at 02:00 Eastern; systemd honors the explicit timezone on Mountain-time cottonwood.
        schedule: '*-*-* 02:00:00 America/New_York'
        delete_target_snapshots: false
        target_snapshot_prune:
          keep_days: 90
          patterns:
            - autosnap_*
            - __replicate_*
        syncoid_options:
          - --no-sync-snap
          - --no-privilege-elevation
      replication_jobs:
        pull-osiris:
          # Keep this plan under Cottonwood's 70 GB backup quota; neo/games and neo/pictures are too large.
          syncoid_options:
            - --identifier=osiris
            - --sshkey=/root/.ssh/homelab-zfs-pull_tower_ed25519
          plans:
            - source: zfs-pull@10.0.0.80:vm-disks/tower/appdata
              target: cache/tower/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/helm/appdata
              target: cache/helm/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/neo/appdata
              target: cache/neo/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/neo/documents
              target: cache/neo/documents
            - source: zfs-pull@10.0.0.80:vm-disks/neo/logseq
              target: cache/neo/logseq
            - source: zfs-pull@10.0.0.80:vm-disks/neo/obsidian
              target: cache/neo/obsidian
      pull_source_access:
        datasets:
          - cache/appdata
          - cache/pictures
        allowed_pullers:
          - name: osiris
            from: 192.168.3.3
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIm5VbYsR/VX3d5OVxrt542e6D9fp1JJmtt0/wcT97wK homelab-zfs-pull osiris cottonwood 20260430
    apt-upgrade:
      schedule: '*-*-* 08:05:00'
      autoupgrade: true

