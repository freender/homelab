# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
        - vault-hdd
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pve-sdn:
      zone: vlans
      bridge: vmbr0
      nodes:
        - ace
        - bray
        - clovis
      vnets:
        - name: main10
          tag: 10
          alias: Main LAN VLAN 10
        - name: srv40
          tag: 40
          alias: Server workload VLAN 40
    pbs-client-backup:
      schedule: '*-*-* 00:30:00'
      repository: pve-backup@pbs@xur.freender.internal:backup-main
      secret_profile: backup-main
      backup_id: pve-cluster
      runner: native
      archives:
        - name: etc-pve
          path: /etc/pve
    pve-backup:
      pbs_setup:
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system
            mount_exclude_profiles:
              /mnt/cache/appdata:
                - appdata
    pve-zfs-large-block-patch:
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_template: ace:cluster-lxc
      snapshot_templates:
        cluster-lxc:
          snapshot_defaults:
            recursive: false
            process_children_only: false
            daily: 7
            weekly: 4
            monthly: 2
          snapshot_plans:
            - migratable_lxc_group: ace:cluster
      migratable_lxc_groups:
        cluster:
          # Metadata only: PVE replication handles movement, PBS handles DR.
          # Broadly deployed jobs act only when the related LXC is active locally.
          plans:
            - name: tower-appdata
              vmid: 101
              dataset: vm-flash/subvol-101-disk-1
            - name: helm-appdata
              vmid: 107
              dataset: vm-flash/subvol-107-disk-1
            - name: neo-appdata
              vmid: 108
              dataset: vm-flash/subvol-108-disk-1
            - name: neo-pictures
              vmid: 108
              dataset: vm-flash/subvol-108-disk-2
            - name: neo-documents
              vmid: 108
              dataset: vm-flash/subvol-108-disk-3
            - name: neo-obsidian
              vmid: 108
              dataset: vm-flash/subvol-108-disk-4
            - name: neo-logseq
              vmid: 108
              dataset: vm-flash/subvol-108-disk-5
            - name: neo-games
              vmid: 108
              dataset: vm-flash/subvol-108-disk-6
      replication_job_templates:
        push-neo-data-cinci:
          # Each cluster node runs this only when neo (vmid 108) is active locally.
          schedule: '*-*-* 03:00:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-push_cinci_ed25519
          migratable_lxc_group: ace:cluster
          active_lxc_source: local
          target_root: zfs-push@cinci.internal:cache/neo
          plans:
            - name: neo-pictures
              target: pictures
            - name: neo-documents
              target: documents
            - name: neo-games
              target: games
        push-neo-pictures-cottonwood:
          # Disabled until cottonwood picture replication is explicitly enabled.
          enabled: false
          schedule: '*-*-* 03:30:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-push_cottonwood_ed25519
          migratable_lxc_group: ace:cluster
          active_lxc_source: local
          target_root: zfs-push@cottonwood.internal:cache/neo
          plans:
            - name: neo-pictures
              target: pictures
      replication_job_sets:
        cluster:
          - name: push-neo-data
            template: ace:push-neo-data-cinci
          - name: push-neo-pictures-cottonwood
            template: ace:push-neo-pictures-cottonwood
      replication_jobs:
        cluster: ace:cluster
      push_target_access_templates:
        neo-data:
          user: zfs-push
          datasets:
            - cache/neo/pictures
            - cache/neo/documents
            - cache/neo/games
          allowed_pushers:
            - name: ace
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOEL/YS/cvrzxHaVfGkOgKBV1N41AnNsMy8mZv2j07cB homelab-zfs-push ace cinci 20260524
            - name: bray
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKVMz+kretSrI8TEsquDQ+8QdxjVavuMFB1hAawT/rn+ homelab-zfs-push bray cinci 20260523
            - name: clovis
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFh9AQdyfRrDy8n6EKPmlPQNsNcUZ5Z/pi3RbT5FK1cH homelab-zfs-push clovis cinci 20260523
            - name: osiris
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOuj3yBFdVcsFpCCvVcVRi8FE1KGyp4tS3n5aAwa0RSj homelab-zfs-push osiris cinci 20260524
    pve-gpu-passthrough:
    disk-spindown:
      idle_seconds: 1800
      command_type: ata
      symlink_policy: 1
      wakeup_schedule: "*-*-* 03:55:00"

bray:
  config:
    type: pve
    hostname: bray.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_template: ace:cluster-lxc
      replication_jobs:
        cluster: ace:cluster
    pve-gpu-passthrough:

clovis:
  config:
    type: pve
    hostname: clovis.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    pve-gpu-passthrough:
      isolate_host_gpu: false
      pci_ids: "10de:2208,10de:1aef"
    disk-spindown:
      idle_seconds: 1800
      command_type: ata
      symlink_policy: 1
      wakeup_schedule: "*-*-* 03:55:00"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
        - vault-hdd
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    pve-zfs-large-block-patch:
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_template: ace:cluster-lxc
      replication_jobs:
        cluster: ace:cluster

osiris:
  config:
    type: pve
    hostname: osiris.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
    pve-sdn:
      zone: vlans
      bridge: vmbr0
      nodes:
        - osiris
      vnets:
        - name: main10
          tag: 10
          alias: Main LAN VLAN 10
        - name: srv40
          tag: 40
          alias: Server workload VLAN 40
    pve-gpu-passthrough:
    zfs-automation:
      manage_snapshots: false
      manage_scrub: false
      manage_health_check: false
      pools:
        - vm-flash
      replication_jobs:
        cluster: ace:cluster
    pbs-client-backup:
      schedule: '*-*-* 00:30:00'
      repository: xur-sync@pbs@cinci.internal:backup-cinci
      secret_profile: backup-cinci
      backup_id: pve-standalone
      runner: native
      archives:
        - name: etc-pve
          path: /etc/pve
    pve-backup:
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
            fingerprint: "d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7"
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system
          - schedule: '*-*-* 22:30:00'
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  config:
    type: ubuntu
    hostname: cottonwood.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: denysc
      sshkey: homelab
  features:
    pve-exporters:
      runtime: docker
    docker:
      update_schedule: '*-*-* 02:00:00'
    ubuntu-setup:
      deploy_user: denysc
      timezone: America/Denver
      wireguard: true
      network:
        pin_interface:
          name: nic0
    zfs-automation:
      # Keep cottonwood snapshots at 00:00 Eastern; systemd honors the explicit timezone on Mountain-time cottonwood.
      snapshot_schedule: '*-*-* 00:00:00 America/New_York'
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: cache/appdata
        - dataset: cache/pictures
      push_target_access:
        # Disabled until bray/clovis Neo picture push replication is ready to enable.
        enabled: false
        user: zfs-push
        datasets:
          - cache/neo/pictures
        allowed_pushers:
          - name: ace
            from: "*"
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO5sDUP3ICCEIHi3UmSWxLjb35lMbRNWW8hzpLfQqKgN homelab-zfs-push ace cottonwood 20260524
          - name: bray
            from: "*"
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN6UMNPT1tB5m+CdRVJo9Glqn+JVtzKX8zWiY5YRt1Th homelab-zfs-push bray cottonwood 20260524
          - name: clovis
            from: "*"
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICGUb4NqMyY/zNNnzj7bpCOk2f5CRS2mJ+puS+UxDRdj homelab-zfs-push clovis cottonwood 20260524
          - name: osiris
            from: "*"
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAXC89itZmPVSdMp0dIqNiA5zTDd9bKW8eAN8pMsEWaB homelab-zfs-push osiris cottonwood 20260524
    pbs-client-backup:
      enabled: true
      schedule: '*-*-* 00:20:00 America/Denver'
      repository: cottonwood-host-backup@pbs!host-backup@localhost:backup-cottonwood-hosts
      secret_profile: backup-cottonwood-hosts
      backup_id: cottonwood
      runner: docker
      docker_image: ghcr.io/freender/pbs:latest
      docker_network: container:zavala
      archives:
        - name: appdata
          dataset: cache/appdata
          exclude_profiles:
            - appdata
        - name: wireguard
          path: /etc/wireguard
    apt-upgrade:
      schedule: '*-*-* 08:05:00'
      autoupgrade: true

cinci:
  config:
    type: ubuntu
    hostname: cinci.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: sysadm
      sshkey: homelab
  features:
    pve-exporters:
      runtime: docker
    docker:
      update_schedule: '*-*-* 02:00:00'
    ubuntu-setup:
      deploy_user: sysadm
      timezone: America/New_York
      network:
        pin_interface:
          name: nic0
      wireguard: true
    zfs-automation:
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: cache/appdata
      push_target_access:
        template: ace:neo-data
    pbs-client-backup:
      schedule: '*-*-* 00:20:00'
      repository: cinci-backup@pbs!host-backup-2026@localhost:backup-cinci-hosts
      secret_profile: backup-cinci-hosts
      backup_id: cinci
      runner: docker
      docker_image: ghcr.io/freender/pbs:latest
      docker_network: container:zavala
      archives:
        - name: appdata
          dataset: cache/appdata
          exclude_profiles:
            - appdata
        - name: wireguard
          path: /etc/wireguard
    apt-upgrade:
      schedule: '*-*-* 08:04:00'
      autoupgrade: true

helm:
  config:
    type: ubuntu
    hostname: helm.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: helm
      interface: nic0
      healthcheck_host_env: KEEPALIVED_HELM_HEALTHCHECK_HOST
      healthcheck_url_env: KEEPALIVED_HELM_HEALTHCHECK_URL
      virtual_router_id: 50
      priority: 100
      advert_interval: 1
      preempt_delay: 60
      unicast_src_ip: 10.0.40.245
      unicast_peers:
        - 10.0.40.10
        - 10.0.40.18
      virtual_ips:
        - 10.0.40.15 dev nic0
    docker:
      update_schedule: '*-*-* 02:00:00'
    apt-upgrade:
      schedule: '*-*-* 08:01:00'
      autoupgrade: true

