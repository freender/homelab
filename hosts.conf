# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
    zfs_pool: cache
    zfs_mountpoint: /mnt/cache
  features:
    pve-exporters:
    ceph:
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pve-backup:
      proxmox_backup_client:
        schedule: "00:30"
        repository: pve-backup@pbs@xur.freender.internal:backup-main
        secret_profile: backup-main
        backup_id: pve-cluster
        archive_name: etc-pve
    pve-lxc-mounts:
      containers:
        - ctid: 101
          root_mounts:
            - slot: 0
              source: /cache
              target: /mnt/cache
              backup: 0
            - slot: 1
              source: /tank
              target: /mnt/tank
              backup: 0
          idmapped_roots:
            - /cache
            - /tank
    zfs-automation:
      snapshot_schedule: '*-*-* 06:30:00'
      replication_schedule: '*-*-* 06:45:00'
      manage_scrub: false
      manage_health_check: false
      snapshot_plans:
        - dataset: cache
          exclude:
            - downloads
            - timemachine
            - transcode
          daily: 7
          weekly: 4
          monthly: 3
      replication_plans:
        - source: cache/appdata
          target: tank/backup/appdata
        - source: cache/cinci
          target: tank/backup/cinci
        - source: cache/tower
          target: tank/backup/tower
        - source: cache/timemachine
          target: tank/backup/timemachine
        - source: cache/pictures
          target: tank/backup/pictures
        - source: cache/obsidian
          target: tank/backup/obsidian
        - source: cache/logseq
          target: tank/backup/logseq
        - source: cache/homes
          target: tank/backup/homes
        - source: cache/helm
          target: tank/backup/helm
        - source: cache/games
          target: tank/backup/games
        - source: cache/documents
          target: tank/backup/documents
        - source: cache/cottonwood
          target: tank/backup/cottonwood
    apt-upgrade:

bray:
  config:
    type: pve
    hostname: bray.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    ceph:
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    apt-upgrade:

clovis:
  config:
    type: pve
    hostname: clovis.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    ceph:
    pve-gpu-passthrough:
      pci_ids: "10de:2208,10de:1aef,8086:9bc5"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    apt-upgrade:

osiris:
  config:
    type: pve
    hostname: osiris.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
    pve-backup:
      proxmox_backup_client:
        schedule: "00:30"
        repository: xur-sync@pbs@cinci.internal:backup-cinci
        secret_profile: backup-cinci
        backup_id: pve-standalone
        archive_name: etc-pve
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
            fingerprint: "d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7"
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: "23:00"
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
          - schedule: "22:30"
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
    apt-upgrade:
      schedule: "09:00"
      autoupgrade: true

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  config:
    type: ubuntu
    hostname: cottonwood.internal
    user: root
    sshkey: infra
    ssh_config:
      user: denysc
      sshkey: homelab
    zfs_pool: cache
    zfs_mountpoint: /mnt/cache
  features:
    docker:
      start_schedule: '*-*-* 00:15:00'
    ubuntu-setup:
      deploy_user: denysc
      timezone: America/Denver
      network:
        pin_interface:
          name: nic0
    zfs-automation:
      snapshot_schedule: '*-*-* 05:30:00'
      replication_schedule: '*-*-* 00:00:00'
      replication_post_hook: /mnt/cache/appdata/.homelab/ubuntu-setup/fix_backup_permissions.sh
      docker_restart_command: ''
      sanoid:
        daily: 7
        weekly: 4
        monthly: 3
      replication:
        source: cache/appdata
        target: cache/backup/appdata

cinci:
  config:
    type: ubuntu
    hostname: cinci.internal
    user: root
    sshkey: infra
    ssh_config:
      user: sysadm
      sshkey: homelab
    zfs_pool: cache
    zfs_mountpoint: /mnt/cache
  features:
    docker:
      start_schedule: '*-*-* 02:45:00'
    ubuntu-setup:
      deploy_user: sysadm
      timezone: America/New_York
      network:
        pin_interface:
          name: nic0
      wireguard: true
    zfs-automation:
      snapshot_schedule: '*-*-* 04:35:00'
      replication_schedule: '*-*-* 02:30:00'
      replication_post_hook: /mnt/cache/appdata/.homelab/ubuntu-setup/fix_backup_permissions.sh
      docker_restart_command: ''
      sanoid:
        exclude:
          - pbs-datastore
        daily: 7
        weekly: 4
        monthly: 3
      replication:
        source: cache/appdata
        target: cache/backup/appdata

zavala:
  config:
    type: ubuntu
    hostname: zavala.internal
    user: root
    sshkey: homelab
  features:

helm:
  config:
    type: ubuntu
    hostname: helm.freender.internal
    user: freender
    sshkey: homelab
  features:
    docker:
      backup: true

