# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
    zfs_pool: cache
    zfs_mountpoint: /mnt/cache
  media_storage:
    data_slots: [1, 2, 3, 4, 5, 6, 7]
    parity_slots: [1]
    raw:
      data_mount_prefix: /disk
      parity_mount_prefix: /parity
    pool:
      root_path: /user
      cache_media_path: /cache/media
      merged_media_path: /user/media
      hdd_only_media_path: /user0/media
    export:
      data_mount_prefix: /mnt/disk
      cache_media_path: /mnt/cache/media
      merged_media_path: /mnt/user/media
      hdd_only_media_path: /mnt/user0/media
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - cache
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pve-backup:
      proxmox_backup_client:
        schedule: "00:30"
        repository: pve-backup@pbs@xur.freender.internal:backup-main
        secret_profile: backup-main
        backup_id: pve-cluster
        archive_name: etc-pve
    pve-lxc-mounts:
      containers:
        - ctid: 101
          features:
            fuse: 1
            keyctl: 1
            nesting: 1
          root_mounts:
            - slot: 0
              source: /cache
              target: /mnt/cache
              backup: 0
          idmapped_roots:
            - /cache
          export_media_storage: true
    media-pool:
      create_policy: ff
      min_free_space: 100G
    media-mover:
      schedule: daily
      plex_mount_root: /data
      tautulli_lookback_days: 180
      frequent_budget: 500G
      cache_min_free_space: 800G
      cache_target_free_space: 900G
      state_file: /var/lib/homelab-media-mover/state.json
      ignore_relative_paths:
        - downloads
    snapraid:
      sync_schedule: daily
    zfs-automation:
      snapshot_schedule: '*-*-* 06:30:00'
      manage_scrub: false
      manage_health_check: false
      snapshot_plans:
        - dataset: cache
          exclude:
            - backup
            - downloads
            - media
            - timemachine
            - transcode
          daily: 7
          weekly: 4
          monthly: 3
      replication_jobs:
        local:
          schedule: '*-*-* 06:45:00'
          plans:
            - source: cache/appdata
              target: cache/backup/appdata
              post_hook: 'if [[ -d /cache/backup/appdata ]]; then chown -R 1000:1000 /cache/backup/appdata; fi'
        remote:
          schedule: '*-*-* 07:15:00'
          plans:
            - source: cache/appdata
              target: root@osiris.freender.internal:cache/appdata
            - source: cache/cinci
              target: root@osiris.freender.internal:cache/cinci
            - source: cache/tower
              target: root@osiris.freender.internal:cache/tower
            - source: cache/pictures
              target: root@osiris.freender.internal:cache/pictures
            - source: cache/obsidian
              target: root@osiris.freender.internal:cache/obsidian
            - source: cache/logseq
              target: root@osiris.freender.internal:cache/logseq
            - source: cache/homes
              target: root@osiris.freender.internal:cache/homes
            - source: cache/helm
              target: root@osiris.freender.internal:cache/helm
            - source: cache/games
              target: root@osiris.freender.internal:cache/games
            - source: cache/documents
              target: root@osiris.freender.internal:cache/documents
            - source: cache/cottonwood
              target: root@osiris.freender.internal:cache/cottonwood
    pve-gpu-passthrough:
    apt-upgrade:

bray:
  config:
    type: pve
    hostname: bray.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    pve-gpu-passthrough:
    apt-upgrade:

clovis:
  config:
    type: pve
    hostname: clovis.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    pve-gpu-passthrough:
      isolate_host_gpu: true
      pci_ids: "10de:2208,10de:1aef,8086:9bc5"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    apt-upgrade:

osiris:
  config:
    type: pve
    hostname: osiris.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
    pve-gpu-passthrough:
    pve-backup:
      proxmox_backup_client:
        schedule: "00:30"
        repository: xur-sync@pbs@cinci.internal:backup-cinci
        secret_profile: backup-cinci
        backup_id: pve-standalone
        archive_name: etc-pve
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
            fingerprint: "d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7"
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: "23:00"
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
          - schedule: "22:30"
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
    apt-upgrade:
      schedule: "09:00"
      autoupgrade: true

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  config:
    type: ubuntu
    hostname: cottonwood.internal
    user: root
    sshkey: infra
    ssh_config:
      user: denysc
      sshkey: homelab
    zfs_pool: cache
    zfs_mountpoint: /mnt/cache
  features:
    docker:
      start_schedule: '*-*-* 00:15:00'
    ubuntu-setup:
      deploy_user: denysc
      timezone: America/Denver
      network:
        pin_interface:
          name: nic0
    zfs-automation:
      snapshot_schedule: '*-*-* 05:30:00'
      replication_schedule: '*-*-* 00:00:00'
      replication_post_hook: /mnt/cache/appdata/.homelab/ubuntu-setup/fix_backup_permissions.sh
      docker_restart_command: ''
      sanoid:
        daily: 7
        weekly: 4
        monthly: 3
      replication:
        source: cache/appdata
        target: cache/backup/appdata

cinci:
  config:
    type: ubuntu
    hostname: cinci.internal
    user: root
    sshkey: infra
    ssh_config:
      user: sysadm
      sshkey: homelab
    zfs_pool: cache
    zfs_mountpoint: /mnt/cache
  features:
    docker:
      start_schedule: '*-*-* 02:45:00'
    ubuntu-setup:
      deploy_user: sysadm
      timezone: America/New_York
      network:
        pin_interface:
          name: nic0
      wireguard: true
    zfs-automation:
      snapshot_schedule: '*-*-* 04:35:00'
      replication_schedule: '*-*-* 02:30:00'
      replication_post_hook: /mnt/cache/appdata/.homelab/ubuntu-setup/fix_backup_permissions.sh
      docker_restart_command: ''
      sanoid:
        exclude:
          - pbs-datastore
        daily: 7
        weekly: 4
        monthly: 3
      replication:
        source: cache/appdata
        target: cache/backup/appdata

zavala:
  config:
    type: ubuntu
    hostname: zavala.internal
    user: root
    sshkey: homelab
  features:

helm:
  config:
    type: ubuntu
    hostname: helm.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: helm
      interface: nic0
      healthcheck_host: traefik2.freender.net
      healthcheck_url: https://traefik2.freender.net/ping
      virtual_router_id: 50
      priority: 100
      advert_interval: 1
      unicast_src_ip: 10.0.40.245
      unicast_peers:
        - 10.0.40.10
        - 10.0.40.163
      virtual_ips:
        - 10.0.40.15 dev nic0
    docker:
      backup: true
      run_on_boot: true

# -----------------------------------------------------------------------------
# LXC Containers
# -----------------------------------------------------------------------------

xur:
  config:
    type: pbs
    hostname: xur.freender.internal
    user: root
    sshkey: infra
  features:

orbit:
  config:
    type: ubuntu
    hostname: orbit.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: orbit
      interface: eth0
      healthcheck_host: traefik3.freender.net
      healthcheck_url: https://traefik3.freender.net/ping
      virtual_router_id: 50
      priority: 99
      advert_interval: 1
      unicast_src_ip: 10.0.40.163
      unicast_peers:
        - 10.0.40.10
        - 10.0.40.245
      virtual_ips:
        - 10.0.40.15 dev eth0
    docker:
      run_on_boot: true

tower:
  config:
    type: ubuntu
    hostname: tower.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  media_storage_ref: ace
  features:
    keepalived:
      instance_name: homelab
      interface: eth0
      healthcheck_host: traefik.freender.net
      healthcheck_url: https://traefik.freender.net/ping
      virtual_router_id: 50
      priority: 111
      advert_interval: 1
      unicast_src_ip: 10.0.40.10
      unicast_peers:
        - 10.0.40.245
        - 10.0.40.163
      virtual_ips:
        - 10.0.40.15 dev eth0
    docker:
      run_on_boot: true
      start_schedule: '*-*-* 07:00:00'
      syncthing_unpause_schedule: '*-*-* 02:15:00'
      syncthing_pause_schedule: '*-*-* 07:00:00'
    media-pool:
      create_policy: ff
      min_free_space: 100G

riven:
  config:
    type: ubuntu
    hostname: riven.freender.internal
    user: freender
    sshkey: homelab
  features:
    ssh-config:


