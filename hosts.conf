exo:
  config:
    type: macos
    hostname: exo.freender.internal
    user: freender
    sshkey: homelab
    agent: op
  features:
    ssh-config:

pi-kvm:
  config:
    type: pikvm
    hostname: pi-kvm.freender.internal
    user: root
    sshkey: homelab
  features:
