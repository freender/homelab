# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
  media_storage:
    data_slots: [1, 2, 3, 4, 5, 6, 7]
    parity_slots: [1]
    raw:
      data_mount_prefix: /disk
      parity_mount_prefix: /parity
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pve-backup:
      proxmox_backup_client:
        schedule: '*-*-* 00:30:00'
        repository: pve-backup@pbs@xur.freender.internal:backup-main
        secret_profile: backup-main
        backup_id: pve-cluster
        archive_name: etc-pve
    disk-spindown:
      idle_seconds: 1800
    zfs-automation:
      snapshot_schedule: '*-*-* 00:00:00'
      manage_scrub: false
      manage_health_check: false
      snapshot_plans:
        - dataset: vm-disks/subvol-101-disk-1
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
      pull_source_access:
        user: zfs-pull
        datasets:
          - vm-disks/subvol-101-disk-1
        allowed_pullers:
          - name: cinci
            from: 10.0.1.6
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM07Dv4fxB9wMkLHX5U0sRf0ltXWrorxeqx9ERuYemLf homelab-zfs-pull cinci 20260426
          - name: cottonwood
            from: 10.0.1.5
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIADiaKCXmChotWjnk7rHJq1g6+inKPz22yD2sd9lJGWs homelab-zfs-pull tower cottonwood 20260426
          - name: osiris
            from: 10.0.0.80
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIZUChNs2mr3IP00sWta7mkFTO5bYBCiAzgiVSR+t9+g homelab-zfs-pull osiris ace 20260427
    pve-gpu-passthrough:

bray:
  config:
    type: pve
    hostname: bray.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    pve-lxc-mounts:
      containers:
        - ctid: 108
          features:
            keyctl: 1
            nesting: 1
          root_mounts:
            - slot: 0
              source: vm-disks:subvol-108-disk-1
              target: /mnt/cache/appdata
              backup: 1
            - slot: 1
              source: /vm-disks/pictures
              target: /mnt/cache/pictures
              backup: 0
            - slot: 2
              source: /vm-disks/documents
              target: /mnt/cache/documents
              backup: 0
            - slot: 3
              source: /vm-disks/obsidian
              target: /mnt/cache/obsidian
              backup: 0
            - slot: 4
              source: /vm-disks/logseq
              target: /mnt/cache/logseq
              backup: 0
            - slot: 5
              source: /vm-disks/games
              target: /mnt/cache/games
              backup: 0
          use_idmapped_mounts: false
    zfs-automation:
      snapshot_schedule: '*-*-* 00:00:00'
      manage_scrub: false
      manage_health_check: false
      snapshot_plans:
        - dataset: vm-disks/subvol-108-disk-1
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
        - dataset: vm-disks/pictures
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
        - dataset: vm-disks/documents
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
        - dataset: vm-disks/obsidian
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
        - dataset: vm-disks/logseq
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
        - dataset: vm-disks/games
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
      pull_source_access:
        user: zfs-pull
        datasets:
          - vm-disks/subvol-108-disk-1
          - vm-disks/pictures
          - vm-disks/documents
          - vm-disks/obsidian
          - vm-disks/logseq
          - vm-disks/games
        allowed_pullers:
          - name: osiris
            from: 10.0.0.80
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHYT9WOutoyAs/qXBLcp5g4xojo9zKrIWeKD1yXDxrzL homelab-zfs-pull osiris bray 20260429
    pve-gpu-passthrough:

clovis:
  config:
    type: pve
    hostname: clovis.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    pve-gpu-passthrough:
      isolate_host_gpu: false
      pci_ids: "10de:2208,10de:1aef"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    zfs-automation:
      snapshot_schedule: '*-*-* 00:00:00'
      manage_scrub: false
      manage_health_check: false
      snapshot_plans:
        - dataset: rpool/subvol-107-disk-1
          recursive: false
          process_children_only: false
          daily: 7
          weekly: 4
          monthly: 2
      pull_source_access:
        user: zfs-pull
        datasets:
          - rpool/subvol-107-disk-1
        allowed_pullers:
          - name: osiris
            from: 10.0.0.80
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMjMGb9/YmhE4jO5vbw5hTAoy1ImnGPxI7UxiQ0zgaLs homelab-zfs-pull osiris clovis 20260430

osiris:
  config:
    type: pve
    hostname: osiris.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-disks
    pve-lxc-mounts:
      containers:
        - ctid: 105
          features:
            nesting: 1
          root_mounts:
            - slot: 0
              source: /vm-disks/pbs-datastore
              target: /backup
              backup: 0
          use_idmapped_mounts: false
        - ctid: 111
          features:
            nesting: 1
          root_mounts:
            - slot: 0
              source: /vm-disks/timemachine
              target: /srv/timemachine
              backup: 0
          use_idmapped_mounts: false
    pve-gpu-passthrough:
    zfs-automation:
      snapshot_schedule: '*-*-* 00:00:00'
      sanoid:
        dataset: vm-disks
        exclude:
          - pbs-datastore
      manage_scrub: false
      manage_health_check: false
      replication_jobs:
        pull-bray:
          schedule: '*-*-* 00:30:00'
          syncoid_options:
            - --identifier=bray
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_bray_ed25519
          plans:
            - source: zfs-pull@10.0.0.40:vm-disks/subvol-108-disk-1
              target: vm-disks/neo/appdata
            - source: zfs-pull@10.0.0.40:vm-disks/pictures
              target: vm-disks/neo/pictures
            - source: zfs-pull@10.0.0.40:vm-disks/documents
              target: vm-disks/neo/documents
            - source: zfs-pull@10.0.0.40:vm-disks/obsidian
              target: vm-disks/neo/obsidian
            - source: zfs-pull@10.0.0.40:vm-disks/logseq
              target: vm-disks/neo/logseq
            - source: zfs-pull@10.0.0.40:vm-disks/games
              target: vm-disks/neo/games
        pull-clovis:
          schedule: '*-*-* 00:30:00'
          syncoid_options:
            - --identifier=clovis
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_clovis_ed25519
          plans:
            - source: zfs-pull@10.0.0.60:rpool/subvol-107-disk-1
              target: vm-disks/helm/appdata
        pull-ace:
          schedule: '*-*-* 00:30:00'
          syncoid_options:
            - --identifier=ace
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_ace_ed25519
          plans:
            - source: zfs-pull@10.0.0.20:vm-disks/subvol-101-disk-1
              target: vm-disks/tower/appdata
        pull-cinci:
          schedule: '*-*-* 00:30:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=cinci
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_cinci_ed25519
          plans:
            - source: zfs-pull@cinci.internal:cache/appdata
              target: vm-disks/cinci/appdata
        pull-cottonwood:
          enabled: true
          schedule: '*-*-* 00:30:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=cottonwood
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_cottonwood_ed25519
          plans:
            - source: zfs-pull@cottonwood.internal:cache/pictures
              target: vm-disks/cottonwood/pictures
      pull_source_access:
        user: zfs-pull
        datasets:
          - vm-disks/tower/appdata
          - vm-disks/helm/appdata
          - vm-disks/neo/appdata
          - vm-disks/neo/pictures
          - vm-disks/neo/documents
          - vm-disks/neo/logseq
          - vm-disks/neo/obsidian
          - vm-disks/neo/games
        allowed_pullers:
          - name: cinci
            from: 10.0.1.6
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM07Dv4fxB9wMkLHX5U0sRf0ltXWrorxeqx9ERuYemLf homelab-zfs-pull cinci 20260426
          - name: cottonwood
            from: 10.0.1.5
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIADiaKCXmChotWjnk7rHJq1g6+inKPz22yD2sd9lJGWs homelab-zfs-pull tower cottonwood 20260426
    pve-backup:
      proxmox_backup_client:
        schedule: '*-*-* 00:30:00'
        repository: xur-sync@pbs@cinci.internal:backup-cinci
        secret_profile: backup-cinci
        backup_id: pve-standalone
        archive_name: etc-pve
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
            fingerprint: "d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7"
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
          - schedule: '*-*-* 22:30:00'
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  config:
    type: ubuntu
    hostname: cottonwood.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: denysc
      sshkey: homelab
  features:
    docker:
      update_schedule: '*-*-* 02:00:00'
    ubuntu-setup:
      deploy_user: denysc
      timezone: America/Denver
      network:
        pin_interface:
          name: nic0
    zfs-automation:
      # Keep cottonwood snapshots at 00:00 Eastern; systemd honors the explicit timezone on Mountain-time cottonwood.
      snapshot_schedule: '*-*-* 00:00:00 America/New_York'
      sanoid:
        daily: 7
        weekly: 4
        monthly: 2
      replication_jobs:
        pull-osiris:
          # Disabled until cottonwood backup quota allows replication to resume.
          enabled: false
          # Keep offsite pulls at 02:00 Eastern; systemd honors the explicit timezone on Mountain-time cottonwood.
          schedule: '*-*-* 02:00:00 America/New_York'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=osiris
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_tower_ed25519
          plans:
            - source: zfs-pull@10.0.0.80:vm-disks/tower/appdata
              target: cache/tower/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/helm/appdata
              target: cache/helm/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/neo/appdata
              target: cache/neo/appdata
            - source: zfs-pull@10.0.0.80:vm-disks/neo/pictures
              target: cache/neo/pictures
            - source: zfs-pull@10.0.0.80:vm-disks/neo/documents
              target: cache/neo/documents
            - source: zfs-pull@10.0.0.80:vm-disks/neo/logseq
              target: cache/neo/logseq
            - source: zfs-pull@10.0.0.80:vm-disks/neo/obsidian
              target: cache/neo/obsidian
            - source: zfs-pull@10.0.0.80:vm-disks/neo/games
              target: cache/neo/games
      pull_source_access:
        user: zfs-pull
        datasets:
          - cache/appdata
          - cache/pictures
        allowed_pullers:
          - name: osiris
            from: 192.168.3.3
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIm5VbYsR/VX3d5OVxrt542e6D9fp1JJmtt0/wcT97wK homelab-zfs-pull osiris cottonwood 20260430
    apt-upgrade:
      schedule: '*-*-* 08:05:00'
      autoupgrade: true

cinci:
  config:
    type: ubuntu
    hostname: cinci.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: sysadm
      sshkey: homelab
