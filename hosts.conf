# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  type: pve
  features:
    ceph:
    telegraf:
    pve-gpu-passthrough:
      pci_ids: "8086:3e92"
    pve-interfaces:
      mgmt_ip: 10.0.40.20/24
      storage_ip: 10.0.60.20/24
      gateway: 10.0.40.1
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-notifications:
    pve-postinstall:
      timezone: America/New_York
      backup:
        cluster:
          schedule: "00:30"
          repository: pve-backup@pbs@10.0.40.85:backup-main
          backup_id: pve-cluster-config
          archive_name: etc-pve
    apt-upgrade:

bray:
  type: pve
  features:
    ceph:
    telegraf:
    pve-gpu-passthrough:
      pci_ids: "8086:4626"
    pve-interfaces:
      mgmt_ip: 10.0.40.40/24
      storage_ip: 10.0.60.40/24
      gateway: 10.0.40.1
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
    apt-upgrade:

clovis:
  type: pve
  features:
    ceph:
    telegraf:
    pve-gpu-passthrough:
      pci_ids: "10de:2208,10de:1aef,8086:9bc5"
    pve-interfaces:
      mgmt_ip: 10.0.40.60/24
      storage_ip: 10.0.60.60/24
      gateway: 10.0.40.1
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
    apt-upgrade:

osiris:
  type: pve
  features:
    telegraf:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-notifications:
    pve-postinstall:
      timezone: America/New_York
      backup:
        standalone:
          storages:
            - name: backup-cinci
              server: 192.168.86.77
              datastore: backup-cinci
              username: xur-sync@pbs
              fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
          jobs:
            - schedule: "22:30"
              storage: backup-cinci
              vmid: "105"
              compress: zstd
              mode: snapshot
              notes_template: "{{guestname}}"
              notification_mode: notification-system
              prune_backups: keep-all=1
    apt-upgrade:

# -----------------------------------------------------------------------------
# TrueNAS
# -----------------------------------------------------------------------------

tower:
  type: truenas
  features:
    docker:
      user: freender
      owner: 1000
      group: 1000

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  type: ubuntu
  features:
    docker:
      user: denysc
      owner: 1000
      group: 1000

cinci:
  type: ubuntu
  features:
    docker:
      user: sysadm
      owner: 1000
      group: 1000

zavala:
  type: ubuntu
  features:
    apt-upgrade:

xur:
  type: ubuntu
  features:
    apt-upgrade:

helm:
  type: ubuntu
  features:
    ssh:
    docker:
      user: freender
      backup: true

orbit:
  type: ubuntu
  features: {}


# -----------------------------------------------------------------------------
# MacOS
# -----------------------------------------------------------------------------

exo:
  type: macos
  features:
    ssh:
