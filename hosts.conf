# hosts.conf - Central host inventory

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
        - vault-hdd
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pbs-client-backup:
      schedule: '*-*-* 00:30:00'
      repository: pve-backup@pbs@xur.freender.internal:backup-main
      secret_profile: backup-main
      backup_id: pve-cluster
      runner: native
      archives:
        - name: etc-pve
          path: /etc/pve
    pve-backup:
      pbs_setup:
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system
            mount_exclude_profiles:
              /mnt/cache/appdata:
                - appdata
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - migratable_lxc_snapshot_group: ace:cluster
      migratable_lxc_snapshot_groups:
        cluster:
          # Metadata only: PVE replication handles movement, PBS handles DR.
          # These plans let each cluster node snapshot only locally active LXCs.
          plans:
            - vmid: 101
              dataset: vm-flash/subvol-101-disk-1
            - vmid: 107
              dataset: vm-flash/subvol-107-disk-1
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-1
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-2
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-3
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-4
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-5
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-6
    pve-gpu-passthrough:
    disk-spindown:
      idle_seconds: 1800
      command_type: ata
      symlink_policy: 1
      wakeup_schedule: "*-*-* 03:50:00"

bray:
  config:
    type: pve
    hostname: bray.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    apcupsd:
      role: master
      name: bray-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
      interfaces:
        mgmt_ip: 10.0.0.40/24
        storage_ip: 10.0.60.40/24
        gateway: 10.0.0.1
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - migratable_lxc_snapshot_group: ace:cluster
      pull_source_access:
        user: zfs-pull
        datasets:
          - vm-flash/subvol-108-disk-2
          - vm-flash/subvol-108-disk-3
          - vm-flash/subvol-108-disk-6
        allowed_pullers:
          - name: cinci
            from: 10.0.1.6
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM07Dv4fxB9wMkLHX5U0sRf0ltXWrorxeqx9ERuYemLf homelab-zfs-pull cinci 20260426
    pve-gpu-passthrough:

clovis:
  config:
    type: pve
    hostname: clovis.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    pve-gpu-passthrough:
      isolate_host_gpu: false
      pci_ids: "10de:2208,10de:1aef"
    disk-spindown:
      idle_seconds: 1800
      command_type: ata
      symlink_policy: 1
      wakeup_schedule: "*-*-* 03:50:00"
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
        - vault-hdd
      interfaces:
        mgmt_ip: 10.0.0.60/24
        storage_ip: 10.0.60.60/24
        gateway: 10.0.0.1
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - migratable_lxc_snapshot_group: clovis:cluster
      migratable_lxc_snapshot_groups:
        cluster:
          # Clovis uses the renamed vm-flash storage; bray keeps a legacy group until converted.
          plans:
            - vmid: 101
              dataset: vm-flash/subvol-101-disk-1
            - vmid: 107
              dataset: vm-flash/subvol-107-disk-1
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-1
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-2
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-3
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-4
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-5
            - vmid: 108
              dataset: vm-flash/subvol-108-disk-6
      pull_source_access:
        user: zfs-pull
        datasets:
          - vm-flash/subvol-108-disk-2
          - vm-flash/subvol-108-disk-3
          - vm-flash/subvol-108-disk-6
        allowed_pullers:
          - name: cinci
            from: 10.0.1.6
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM07Dv4fxB9wMkLHX5U0sRf0ltXWrorxeqx9ERuYemLf homelab-zfs-pull cinci 20260426

osiris:
  config:
    type: pve
    hostname: osiris.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
    apcupsd:
      role: master-standalone
      name: osiris-ups
      device: ""
      nisip: 0.0.0.0
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
    pve-gpu-passthrough:
    zfs-automation:
      manage_snapshots: false
      manage_scrub: false
      manage_health_check: false
      manage_replication: false
      pools:
        - vm-flash
      replication_jobs:
        pull-cottonwood-pictures:
          # Disabled until cottonwood picture replication is explicitly enabled.
          enabled: false
          schedule: '*-*-* 02:30:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=cottonwood
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_cottonwood_ed25519
          plans:
            - source: zfs-pull@cottonwood.internal:cache/pictures
              target: vm-flash/cottonwood/pictures
      pull_source_access:
        # Disabled reverse source access for future cottonwood restore pulls.
        enabled: false
        user: zfs-pull
        datasets:
          - vm-flash/cottonwood/pictures
        allowed_pullers:
          - name: cottonwood
            from: 10.0.1.5
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIADiaKCXmChotWjnk7rHJq1g6+inKPz22yD2sd9lJGWs homelab-zfs-pull tower cottonwood 20260426
    pbs-client-backup:
      schedule: '*-*-* 00:30:00'
      repository: xur-sync@pbs@cinci.internal:backup-cinci
      secret_profile: backup-cinci
      backup_id: pve-standalone
      runner: native
      archives:
        - name: etc-pve
          path: /etc/pve
    pve-backup:
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
            fingerprint: "d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7"
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
            fingerprint: "11:c8:e2:9c:7c:c1:64:2d:78:bb:03:fc:88:f5:2f:a1:74:dc:a9:ff:12:8c:1b:a3:7d:3c:be:62:0f:a8:12:ea"
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system
          - schedule: '*-*-* 22:30:00'
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system

# -----------------------------------------------------------------------------
# Ubuntu Servers
# -----------------------------------------------------------------------------

cottonwood:
  config:
    type: ubuntu
    hostname: cottonwood.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: denysc
      sshkey: homelab
  features:
    pve-exporters:
      runtime: docker
    docker:
      update_schedule: '*-*-* 02:00:00'
    ubuntu-setup:
      deploy_user: denysc
      timezone: America/Denver
      wireguard: true
      network:
        pin_interface:
          name: nic0
    zfs-automation:
      # Keep cottonwood snapshots at 00:00 Eastern; systemd honors the explicit timezone on Mountain-time cottonwood.
      snapshot_schedule: '*-*-* 00:00:00 America/New_York'
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: cache/appdata
        - dataset: cache/pictures
      replication_jobs:
        pull-osiris-cottonwood-pictures:
          # Disabled reverse-restore scaffold for cottonwood pictures.
          enabled: false
          schedule: '*-*-* 02:00:00 America/New_York'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --identifier=osiris
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-pull_osiris_ed25519
          plans:
            - source: zfs-pull@10.0.0.80:vm-flash/cottonwood/pictures
              target: cache/pictures
      pull_source_access:
        # Disabled until cottonwood pictures replication is ready to enable.
        enabled: false
        user: zfs-pull
        datasets:
          - cache/pictures
        allowed_pullers:
          - name: osiris
            from: 192.168.3.3
            public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIm5VbYsR/VX3d5OVxrt542e6D9fp1JJmtt0/wcT97wK homelab-zfs-pull osiris cottonwood 20260430
    pbs-client-backup:
      enabled: true
      schedule: '*-*-* 00:20:00 America/Denver'
      repository: cottonwood-backup@pbs!host-backup@xur.freender.internal:backup-remote-hosts
      secret_profile: backup-xur-cottonwood
      backup_id: cottonwood
      runner: docker
      docker_image: ghcr.io/freender/pbs:latest
      docker_network: bridge
      archives:
        - name: appdata
          dataset: cache/appdata
          exclude_profiles:
            - appdata
        - name: wireguard
          path: /etc/wireguard
    apt-upgrade:
      schedule: '*-*-* 08:05:00'
      autoupgrade: true

cinci:
  config:
    type: ubuntu
    hostname: cinci.internal
    user: root
    sshkey: offsite
    ssh_config:
      user: sysadm
      sshkey: homelab
  features:
    pve-exporters:
      runtime: docker
    docker:
      update_schedule: '*-*-* 02:00:00'
    ubuntu-setup:
      deploy_user: sysadm
      timezone: America/New_York
      network:
        pin_interface:
          name: nic0
      wireguard: true
    zfs-automation:
      snapshot_defaults:
        recursive: false
        process_children_only: false
        daily: 7
        weekly: 4
        monthly: 2
      snapshot_plans:
        - dataset: cache/appdata
      replication_jobs:
        pull-neo-data:
          schedule: '*-*-* 02:00:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --no-sync-snap
            - --no-privilege-elevation
          plans:
            - target: cache/neo/pictures
              dynamic_lxc_source:
                vmid: 108
                candidates:
                  - name: bray
                    source: zfs-pull@10.0.0.40:vm-flash/subvol-108-disk-2
                    sshkey: /root/.ssh/homelab-zfs-pull_ed25519
                    syncoid_options:
                      - --identifier=bray
                  - name: clovis
                    source: zfs-pull@10.0.0.60:vm-flash/subvol-108-disk-2
                    sshkey: /root/.ssh/homelab-zfs-pull_ed25519
                    syncoid_options:
                      - --identifier=clovis
            - target: cache/neo/documents
              dynamic_lxc_source:
                vmid: 108
                candidates:
                  - name: bray
                    source: zfs-pull@10.0.0.40:vm-flash/subvol-108-disk-3
                    sshkey: /root/.ssh/homelab-zfs-pull_ed25519
                    syncoid_options:
                      - --identifier=bray
                  - name: clovis
                    source: zfs-pull@10.0.0.60:vm-flash/subvol-108-disk-3
                    sshkey: /root/.ssh/homelab-zfs-pull_ed25519
                    syncoid_options:
                      - --identifier=clovis
            - target: cache/neo/games
              dynamic_lxc_source:
                vmid: 108
                candidates:
                  - name: bray
                    source: zfs-pull@10.0.0.40:vm-flash/subvol-108-disk-6
                    sshkey: /root/.ssh/homelab-zfs-pull_ed25519
                    syncoid_options:
                      - --identifier=bray
                  - name: clovis
                    source: zfs-pull@10.0.0.60:vm-flash/subvol-108-disk-6
                    sshkey: /root/.ssh/homelab-zfs-pull_ed25519
                    syncoid_options:
                      - --identifier=clovis
    pbs-client-backup:
      schedule: '*-*-* 00:20:00'
      repository: cinci-backup@pbs!host-backup@xur.freender.internal:backup-remote-hosts
      secret_profile: backup-xur-cinci
      backup_id: cinci
      runner: docker
      docker_image: ghcr.io/freender/pbs:latest
      docker_network: container:zavala
      archives:
        - name: appdata
          dataset: cache/appdata
          exclude_profiles:
            - appdata
        - name: wireguard
          path: /etc/wireguard
    apt-upgrade:
      schedule: '*-*-* 08:04:00'
      autoupgrade: true

helm:
  config:
    type: ubuntu
    hostname: helm.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: helm
      interface: nic0
      healthcheck_host_env: KEEPALIVED_HELM_HEALTHCHECK_HOST
      healthcheck_url_env: KEEPALIVED_HELM_HEALTHCHECK_URL
      virtual_router_id: 50
      priority: 100
      advert_interval: 1
      unicast_src_ip: 10.0.40.245
      unicast_peers:
        - 10.0.40.10
        - 10.0.40.18
      virtual_ips:
        - 10.0.40.15 dev nic0
    docker:
      update_schedule: '*-*-* 02:00:00'
    apt-upgrade:
      schedule: '*-*-* 08:01:00'
      autoupgrade: true

