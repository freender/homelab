    apt-upgrade:
      schedule: '*-*-* 08:04:00'
      autoupgrade: true

helm:
  config:
    type: ubuntu
    hostname: helm.freender.internal
    user: root
    sshkey: infra
    ssh_config:
      user: freender
      sshkey: homelab
  features:
    keepalived:
      instance_name: helm
