# hosts.conf - Central host inventory
#
# AI/agent inventory contract:
# - This file is canonical for managed hosts, SSH metadata, deploy targets,
#   feature configuration, schedules, backup repositories, and feature enablement.
# - `config.type` values describe the managed target class: pve, lxc, ubuntu,
#   pbs, macos, or pikvm.
# - `config.hostname`, `config.user`, and `config.sshkey` are deploy/runtime SSH
#   metadata. `config.ssh_config` is an optional human/convenience SSH override
#   and must not replace deploy metadata unless module code explicitly does so.
# - `config.standalone: true` marks PVE nodes that are not rebuilt into the
#   main cluster and may use standalone-specific post-install gates.
# - `features.<name>` blocks are module-owned configuration. Feature blocks with
#   `enabled: false` are planning/inventory data only; do not assume the runtime
#   service is active and do not deploy them unless explicitly requested.
# - Legacy or conversion entries are kept for migration history. Respect comments
#   such as "Do not deploy new features here" and prefer machine-readable
#   lifecycle metadata if present.
# - If Infrastructure Overview disagrees with this file for automation targets or
#   feature config, trust this file and update the Overview after confirming facts.

# -----------------------------------------------------------------------------
# Proxmox VE Cluster
# -----------------------------------------------------------------------------

ace:
  config:
    type: pve
    hostname: ace.freender.internal
    user: root
    sshkey: infra
  features:
    pve-exporters:
      intel_gpu_exporter:
        port: 9400
        refresh_period_ms: 1000
    pve-interface-pinning:
      interfaces:
        - name: nic0
          role: management
          mac: 38:ea:a7:91:cc:60
        - name: nic1
          role: storage
          mac: 38:ea:a7:91:cc:61
        - name: nic2
          role: wol
          mac: e0:d5:5e:25:a5:e0
          wake_on_lan: true
    apcupsd:
      role: slave
      name: bray-ups-slave
      device: bray.freender.internal:3551
      nisip: 127.0.0.1
    pve-postinstall:
      timezone: America/New_York
      import_pools:
        - vm-flash
        - vault-hdd
      interfaces:
        mgmt_ip: 10.0.0.20/24
        storage_ip: 10.0.60.20/24
        gateway: 10.0.0.1
    pbs-client-backup:
      schedule: '*-*-* 00:30:00'
      repository: pve-backup@pbs@xur-storage.freender.internal:backup
      namespace: freender
      secret_profile: backup-main
      backup_id: pve-cluster
      runner: native
      archives:
        - name: etc-pve
          path: /etc/pve
    pve-backup:
      pbs_setup:
        storages:
          - name: backup-local
            server: xur-storage.freender.internal
            datastore: backup
            namespace: freender
            username: pve-backup@pbs
            fingerprint: d6:93:fa:64:27:cb:0f:f2:1c:7d:66:4c:22:3b:a3:11:b7:80:ae:f4:3f:1b:3a:e6:6d:fb:13:73:65:05:d7:a7
            password_var: PBS_BACKUP_MAIN_PASSWORD
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-local
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system
            mount_exclude_profiles:
              /mnt/cache/appdata:
                - appdata
    pve-zfs-large-block-patch:
    pve-zfs-migration-sync-patch:
    pve-lxc-docker-hooks:
      vmids:
        - 101
        - 107
        - 108
    zfs-automation:
      manage_scrub: false
      manage_health_check: false
      snapshot_template: ace:cluster-lxc
      snapshot_templates:
        cluster-lxc:
          snapshot_defaults:
            recursive: false
            process_children_only: false
            daily: 7
            weekly: 4
            monthly: 2
          snapshot_plans:
            - migratable_lxc_group: ace:cluster
      migratable_lxc_groups:
        cluster:
          # Metadata only: PVE replication handles movement, PBS handles DR.
          # Broadly deployed jobs act only when the related LXC is active locally.
          plans:
            - name: tower-appdata
              vmid: 101
              dataset: vm-flash/subvol-101-disk-1
            - name: helm-appdata
              vmid: 107
              dataset: vm-flash/subvol-107-disk-1
            - name: neo-appdata
              vmid: 108
              dataset: vm-flash/subvol-108-disk-1
            - name: neo-pictures
              vmid: 108
              dataset: vm-flash/subvol-108-disk-2
            - name: neo-documents
              vmid: 108
              dataset: vm-flash/subvol-108-disk-3
            - name: neo-obsidian
              vmid: 108
              dataset: vm-flash/subvol-108-disk-4
            - name: neo-logseq
              vmid: 108
              dataset: vm-flash/subvol-108-disk-5
            - name: neo-games
              vmid: 108
              dataset: vm-flash/subvol-108-disk-6
      replication_job_templates:
        push-neo-data-cinci:
          # Each cluster node runs this only when neo (vmid 108) is active locally.
          schedule: '*-*-* 03:00:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-push_ed25519
          migratable_lxc_group: ace:cluster
          active_lxc_source: local
          target_root: zfs-push@cinci.internal:vm-flash
          plans:
            - name: neo-pictures
              target: subvol-109-disk-4
            - name: neo-documents
              target: subvol-109-disk-2
            - name: neo-games
              target: subvol-109-disk-3
        push-neo-pictures-cottonwood:
          # Disabled until cottonwood picture replication is explicitly enabled.
          enabled: false
          schedule: '*-*-* 03:30:00'
          delete_target_snapshots: false
          target_snapshot_prune:
            keep_days: 90
            patterns:
              - autosnap_*
              - __replicate_*
          syncoid_options:
            - --no-sync-snap
            - --no-privilege-elevation
            - --sshkey=/root/.ssh/homelab-zfs-push_ed25519
          migratable_lxc_group: ace:cluster
          active_lxc_source: local
          target_root: zfs-push@cottonwood.internal:vm-flash/neo
          plans:
            - name: neo-pictures
              target: pictures
      replication_job_sets:
        cluster:
          - name: push-neo-data
            template: ace:push-neo-data-cinci
          - name: push-neo-pictures-cottonwood
            template: ace:push-neo-pictures-cottonwood
      replication_jobs:
        cluster: ace:cluster
      push_target_access_templates:
        neo-data:
          user: zfs-push
          datasets:
            - vm-flash/subvol-109-disk-4
            - vm-flash/subvol-109-disk-2
            - vm-flash/subvol-109-disk-3
          allowed_pushers:
            - name: ace
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOEL/YS/cvrzxHaVfGkOgKBV1N41AnNsMy8mZv2j07cB homelab-zfs-push ace cinci 20260524
            - name: bray
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKfdTyEwNoO68zyFoxYZ836yaE1QyY5YbGXS6fjnd9an homelab-zfs-push bray 20260530
            - name: clovis
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFh9AQdyfRrDy8n6EKPmlPQNsNcUZ5Z/pi3RbT5FK1cH homelab-zfs-push clovis cinci 20260523
            - name: osiris
              from: "*"
              public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOuj3yBFdVcsFpCCvVcVRi8FE1KGyp4tS3n5aAwa0RSj homelab-zfs-push osiris cinci 20260524
    pve-gpu-passthrough:
    disk-spindown:
      idle_seconds: 1800
      command_type: ata
      symlink_policy: 1
      wakeup_schedule: "*-*-* 03:55:00"
    pve-autoinstall:
      dmi_uuid: 03d502e0-045e-0525-a506-e00700080009
      boot_disk_serial: S58SNJ0N118314K
      answer_name: ace

