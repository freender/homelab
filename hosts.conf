      repo_url: https://github.com/wget/realtek-r8152-linux.git
      repo_ref: master
      driver_version: 2.21.4
    pve-gpu-passthrough:
    pve-autoinstall:
      dmi_uuid: 27762480-b8ff-11ef-87f5-e2990e421100
      boot_disk_serial: S463NF0K400230E
      answer_name: osiris-pve-rebuild
      # osiris has no pve-postinstall.interfaces (standalone, no storage NIC)
      cidr: 10.0.0.80/24
      gateway: 10.0.0.1
    zfs-automation:
      manage_snapshots: false
      manage_scrub: false
      manage_health_check: false
      pools:
        - vm-flash
      replication_jobs:
        cluster: ace:cluster
    pbs-client-backup:
      schedule: '*-*-* 00:30:00'
      repository: xur-sync@pbs@cinci.internal:backup-cinci
      secret_profile: backup-cinci
      backup_id: pve-standalone
      runner: native
      archives:
        - name: etc-pve
          path: /etc/pve
    pve-backup:
      restore_lxc_configs:
        enabled: true
        autostart: false
        vmids:
          - 105
          - 110
          - 111
      pbs_setup:
        storages:
          - name: backup-main
            server: xur.freender.internal
            datastore: backup-main
            username: pve-backup@pbs
          - name: backup-cinci
            server: cinci.internal
            datastore: backup-cinci
            username: xur-sync@pbs
        jobs:
          - schedule: '*-*-* 23:00:00'
            storage: backup-main
            exclude: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system
          - schedule: '*-*-* 22:30:00'
            storage: backup-cinci
            vmid: "105"
            compress: zstd
            mode: snapshot
            notes_template: "{{guestname}}"
            notification_mode: notification-system
            prune_backups: keep-all=1
            exclude_profiles:
              - system

