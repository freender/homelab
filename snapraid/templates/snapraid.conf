# SnapRAID configuration file
# Generated by homelab deployment

# Parity disk(s)
{% for disk in PARITY_DISKS %}
parity {{ disk.path }}/snapraid.parity
{% endfor %}

# Content file(s)
{% for file in CONTENT_FILES %}
content {{ file }}
{% endfor %}

# Data disk(s)
{% for disk in DATA_DISKS %}
data {{ disk.name }} {{ disk.path }}
{% endfor %}

# Exclude patterns
{% for pattern in EXCLUDE_PATTERNS %}
exclude {{ pattern }}
{% endfor %}

# Options
autosave 250
pool {{ POOL_PATH }}
