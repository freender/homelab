### SnapRAID Daemon Config
# Managed by the homelab repo. Manual UI changes may rewrite this file.

### System
sys_engine = /usr/bin/snapraid
sys_log_directory = /var/log/snapraid
sys_log_retention_days = 120

### Network & REST API
net_enabled = 1
net_port = {{ NET_PORT }}
net_acl = {{ NET_ACL }}
net_security_headers = 1
net_allowed_origin = self
net_config_full_access = 0
net_web_root = /usr/share/snapraidd/commander.zip

### Automation & Maintenance
# Homelab timers own mover orchestration, sync, and scrub scheduling.
sync_threshold_deletes = 50
sync_threshold_updates = 100
sync_prehash = 0
sync_prevent_truncations = 1
scrub_percentage = 0
scrub_older_than = 0
touch_zero_subseconds = 0

### Disk Monitoring & Power
probe_interval_minutes = {{ PROBE_INTERVAL_MINUTES }}
# ace/homelab-disk-spindown owns physical disk power policy.
spindown_idle_minutes = 0

### Notifications
notify_syslog_enabled = 1
notify_syslog_level = info
notify_result_level = error
notify_differences = 1
