# Sunshine on solar (vr-guest). The web UI writes here too: a setting saved there
# shows as sunshine_conf drift until it is copied into the repo or redeployed away.
# Straight from the GPU: no PipeWire, no KDE screen-share prompt (cap_sys_admin).
capture = kms
# NVENC fails in the brew build (CUDA cannot register its frames); Vulkan Video
# runs on the same NVENC hardware.
encoder = vulkan
gamepad = ds5
csrf_allowed_origins = https://solar.freender.internal:47990,https://solar:47990,https://10.0.10.200:47990
