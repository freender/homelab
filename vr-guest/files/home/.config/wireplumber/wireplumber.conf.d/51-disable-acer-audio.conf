# The Acer XB273K's HDMI audio is never listened to, but with the PS VR2 or the
# Sunshine sink gone WirePlumber falls back to it and games play silently.
# Matched by the monitor's ELD name, not node.name: the NVIDIA driver assigns
# HDMI/DP PCMs per connected screen, and the headset shares this card.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Sink"
        alsa.name = "Acer XB273K S"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
